name: Deploy SMART Fieldbook to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "Output/Modul *.md"
      - "Output/assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Assemble static site from original Markdown
        run: |
          mkdir -p _site/modules _site/assets
          cp website/index.html website/styles.css website/app.js website/modul-*.html _site/
          for n in 1 2 3 4 5 6 7 8; do
            cp "Output/Modul $n.md" "_site/modules/Modul $n.md"
          done
          cp -R Output/assets/. _site/assets/
          cat > _site/.nojekyll <<'EOF'
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
