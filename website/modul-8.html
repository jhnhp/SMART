<script id="module-source" type="application/json">"# Pemodelan Digital Soil Mapping\n\n## Tujuan dan Capaian Pembelajaran\n\nPemetaan tanah konvensional yang bertumpu pada delineasi poligon secara manual menghasilkan representasi spasial yang bersifat diskret, dengan asumsi bahwa variasi sifat tanah di dalam batas poligon bersifat seragam dan perubahan antar-poligon terjadi secara mendadak pada garis batas. Padahal, sifat fisik dan kimia tanah di bentang lahan berkembang secara malar (kontinu) mengikuti gradien topografi, bahan induk, organisme, iklim mikro, dan proses geomorfologi lereng (McBratney et al., 2003; Minasny dan McBratney, 2016). *Digital Soil Mapping* (DSM) atau pemetaan tanah digital menjembatani keterbatasan tersebut melalui perumusan fungsi matematis dan algoritma pembelajaran mesin (*machine learning*) yang menghubungkan pengamatan titik sampel lapangan dengan tumpukan kovariat lingkungan spasial beresolusi tinggi (Lagacherie dan McBratney, 2006; Hengl et al., 2018). Sebagai modul pamungkas dalam rangkaian pelatihan survei dan pemetaan sumber daya lahan, Modul 8 mengintegrasikan seluruh produk spasial dan data analitik yang telah dibangun pada Modul 1 hingga Modul 7 ke dalam satu alur pemodelan prediktif yang utuh.\n\nSetelah mempelajari modul ini secara tuntas, peserta pelatihan diharapkan mampu:\n\n1. Memformulasikan kerangka konseptual $\\text{SCORPAN}$ ($S = f(s, c, o, r, p, a, n) + \\varepsilon$) ke dalam matriks desain kovariat lingkungan spasial yang selaras secara sistem proyeksi, ukuran piksel, dan jangkauan geografis (*spatial extent*).\n2. Membandingkan cara kerja matematis, keunggulan, serta keterbatasan empat algoritma pemodelan DSM berbasis pohon keputusan dan ansambel—meliputi *Random Forest* (RF), *Quantile Regression Forest* (QRF), *CatBoost*, dan *Stacking Ensemble*—dalam memprediksi sifat fisik dan kimia tanah yang bersifat nonlinier.\n3. Merancang skema pemisahan data (*data splitting*), validasi silang (*k-fold cross-validation*, *Leave-One-Out Cross-Validation*, dan *spatial block cross-validation*), serta penyeimbangan distribusi target melalui teknik *Synthetic Minority Over-sampling Technique for Regression with Gaussian Noise* (SMOGN) pada ukuran sampel terbatas.\n4. Melaksanakan seleksi fitur prediktor menggunakan *Recursive Feature Elimination* (RFE), mengevaluasi kinerja model prediktif menggunakan metrik baku ($R^2$, $\\text{RMSE}$, $\\text{MAE}$, dan *Lin's Concordance Correlation Coefficient*), serta menginterpretasikan kontribusi fisik kovariat pengendali.\n5. Menganalisis struktur galat residual, gejala penghalusan ekor distribusi (*smoothing of distribution tails*), dan sebaran spasial ketidakpastian prediksi (*Prediction Interval Range* 90% atau $\\text{PIR}_{90}$) guna mendukung pengambilan keputusan pengelolaan lahan dan konservasi tanah di Sub-DAS Bompon.\n\n---\n\n*Ceramah dan diskusi:*\n\n## SCORPAN Sebagai Variabel Lingkungan\n\nFondasi teoretis pemetaan tanah digital bertumpu pada perumusan kembali persamaan faktor pembentuk tanah dokuchaevian yang diperkenalkan oleh Jenny (1941), yaitu $S = f(cl, o, r, p, t, \\dots)$, yang menyatakan bahwa tanah ($S$) merupakan fungsi dari iklim (*climate*, $cl$), organisme ($o$), relief ($r$), bahan induk (*parent material*, $p$), dan waktu (*time*, $t$). Meskipun persamaan Jenny (1941) sangat kokoh untuk menjelaskan genesis tanah secara konseptual (pedogenesis), persamaan tersebut tidak dirancang secara langsung untuk memprediksi nilai atribut tanah pada lokasi yang belum tersampel secara kuantitatif menggunakan citra penginderaan jauh dan sistem informasi geografis. McBratney et al. (2003) mentransformasikan kerangka faktor pembentuk tanah tersebut menjadi model empiris-kuantitatif $\\text{SCORPAN}$ untuk kepentingan prediksi spasial:\n\n$$S_c \\text{ atau } S_a = f(s, c, o, r, p, a, n) + \\varepsilon$$\n\nPersamaan di atas menyatakan bahwa kelas taksonomi tanah ($S_c$) atau atribut tanah kontinu ($S_a$, seperti persentase lempung, debu, pasir, kandungan karbon organik, kapasitas tukar kation, maupun pH tanah) pada suatu piksel merupakan fungsi empiris dari tujuh kelompok prediktor lingkungan ditambah komponen galat acak ($\\varepsilon$) yang tidak terjelaskan oleh prediktor:\n\n1. **$s$ (*soil* / informasi tanah sebelumnya)**: Atribut tanah yang dapat diindera dari pangkalan data peta tanah terdahulu, pengukuran proksimal spektroskopi reflektansi di lapangan, maupun indeks spektral mineralogi permukaan dari citra multispektral/hiperspektral seperti *Clay Index* ($\\text{SWIR}_1 / \\text{SWIR}_2$) dan *Bare Soil Index* (Boettinger et al., 2008).\n2. **$c$ (*climate* / iklim)**: Variabel curah hujan tahunan, suhu udara permukaan rata-rata, evapotranspirasi potensial, dan radiasi surya yang mengatur laju pelapukan kimiawi serta pencucian basa di dalam profil tanah.\n3. **$o$ (*organisms* / organisme dan tutupan lahan)**: Kerapatan kanopi vegetasi, biomassa permukaan, aktivitas perakaran, serta intervensi pengelolaan manusia yang direpresentasikan melalui indeks vegetasi optik (*Normalized Difference Vegetation Index* / $\\text{NDVI}$, *Soil-Adjusted Vegetation Index* / $\\text{SAVI}$, *Enhanced Vegetation Index* / $\\text{EVI}$, *Normalized Difference Water Index* / $\\text{NDWI}$) dan peta penggunaan lahan detail (Mulder et al., 2011).\n4. **$r$ (*relief* / morfometri medan)**: Atribut medan primer dan sekunder yang diturunkan dari *Digital Terrain Model* (DTM), mencakup elevasi, kemiringan lereng (*slope*), arah hadap lereng (*aspect*), kelengkungan profil (*profile curvature*), kelengkungan planimetrik (*plan curvature*), *Topographic Wetness Index* ($\\text{TWI}$), *Topographic Position Index* ($\\text{TPI}$), *Valley Depth*, *Channel Network Base Level* ($\\text{CNBL}$), faktor panjang dan kemiringan lereng ($\\text{LS Factor}$), *Multiresolution Index of Valley Bottom Flatness* ($\\text{MrVBF}$), serta *Multiresolution Index of the Ridge Top Flatness* ($\\text{MrRTF}$) (Wilson dan Gallant, 2000; Gallant dan Dowling, 2003).\n5. **$p$ (*parent material* / bahan induk dan litologi)**: Satuan litologi, formasi geologi, atau tutupan material permukaan (seperti breksi vulkanik, tuf pasiran, dan endapan koluvial-aluvial) yang menentukan cadangan mineral primer dan batas potensial ukuran butir tanah.\n6. **$a$ (*age* / umur permukaan lahan)**: Faktor durasi perkembangan profil tanah atau stabilitas relatif geomorfik permukaan lahan sejak pengendapan atau erosi terakhir.\n7. **$n$ (*space* / posisi spasial)**: Koordinat geografis $(x, y)$, jarak euklides terhadap jaringan pengatusan sungai, atau posisi relatif di dalam cekungan daerah aliran sungai yang menangkap kecenderungan spasial berskala luas (McBratney et al., 2003).\n\n![](assets/modul-8/M8-G01_kerangka-tumpukan-kovariat-scorpan.png)\nGambar 8.1 Arsitektur pemodelan *Digital Soil Mapping* (DSM) di Sub-DAS Bompon yang menghubungkan tumpukan 22 kovariat lingkungan $\\text{SCORPAN}$, ekstraksi matriks desain pada 50 titik sampel, penyeimbangan distribusi SMOGN, seleksi fitur RFE, hingga inferensi spasial tekstur dan ketidakpastian\nSumber: Disintesis dari kerangka McBratney et al. (2003) dan studi empiris Fatmawati (2026)\n\nOperasionalisasi kerangka $\\text{SCORPAN}$ di bentang lahan vulkanik-struktural kuarter seperti Sub-DAS Bompon (luas $\\pm 292,5\\text{ ha}$ di Kabupaten Magelang, Jawa Tengah) menuntut pemilihan kovariat yang peka terhadap variasi lokal. Pada skala sub-DAS dengan rentang elevasi yang sempit ($350\\text{--}512\\text{ m dpl}$), faktor iklim makro ($c$) dan faktor umur geologi regional ($a$) praktis bersifat seragam di seluruh wilayah kajian, sehingga variasi sifat tanah dikendalikan secara dominan oleh interaksi faktor relief ($r$), organisme ($o$), sifat spektral permukaan tanah ($s$), bahan induk lokal ($p$), dan jarak terhadap jaringan sungai ($n$). Sebagaimana dirangkum pada Tabel 8.1 dan diilustrasikan pada Gambar 8.1, studi pemetaan tekstur tanah di Sub-DAS Bompon oleh Fatmawati (2026) menyusun 22 kovariat lingkungan yang diselaraskan ke dalam grid spasial seragam sebelum ditumpangsusunkan (*overlay*) dengan titik pengamatan lapangan.\n\nTabel 8.1 Spesifikasi 22 kovariat lingkungan dalam kerangka $\\text{SCORPAN}$ untuk pemodelan tekstur tanah di Sub-DAS Bompon\n| Faktor SCORPAN | Nama Kovariat Spasial | Sumber Data Utama | Resolusi Asli | Peran Pedogenetik dan Geomorfik pada Sifat Tanah |\n| :--- | :--- | :--- | :--- | :--- |\n| **$S$ (*Soil*)** | *Clay Index* ($\\text{CI} = B_{11}/B_{12}$) | Sentinel-2A Level-2A | 20 m | Menangkap serapan gugus hidroksil ($\\text{Al--OH}$) mineral lempung kaolinit/smektit melalui rasio reflektansi $\\text{SWIR}_1/\\text{SWIR}_2$. |\n| **$O$ (*Organisms*)** | $\\text{NDVI} = (B_8 - B_4)/(B_8 + B_4)$ | Sentinel-2A Level-2A | 10 m | Mengukur kehijauan dan kerapatan tajuk vegetasi yang melindungi permukaan tanah dari pukulan air hujan (*raindrop splash*). |\n| **$O$ (*Organisms*)** | $\\text{SAVI}$ ($L = 0,5$) | Sentinel-2A Level-2A | 10 m | Mengoreksi gangguan pantulan latar tanah terbuka pada kanopi kebun campuran dan lahan pertanian semusim. |\n| **$O$ (*Organisms*)** | $\\text{EVI}$ | Sentinel-2A Level-2A | 10 m | Menjaga kepekaan sinyal biomassa pada tutupan agroforestri rapat tanpa mengalami kejenuhan (*saturation*) pada nilai $\\text{NDVI}$ tinggi. |\n| **$O$ (*Organisms*)** | $\\text{NDWI} = (B_3 - B_8)/(B_3 + B_8)$ | Sentinel-2A Level-2A | 10 m | Merepresentasikan status kebasahan tajuk dan kelembapan permukaan lahan yang berasosiasi dengan retensi air lempung-debu. |\n| **$O$ (*Organisms*)** | Peta Penggunaan Lahan | Foto Udara UAV \u0026 Survei | 0,15 m | Membedakan rezim pengolahan tanah (sawah berteras, tegalan, kebun campuran/agroforestri, semak belukar, permukiman). |\n| **$R$ (*Relief*)** | Elevasi (*Elevation*) | DTM LiDAR / DEM Nasional | 0,5–8 m | Mengatur posisi ketinggian lokal, gradien energi potensial gravitasi, dan zonasi lapukan batuan vulkanik tua versus muda. |\n| **$R$ (*Relief*)** | Kemiringan Lereng (*Slope*) | Turunan DTM (SAGA GIS) | 0,5–8 m | Mengendalikan kecepatan limpasan permukaan (*runoff*), daya kikis erosi lembar, dan pencucian selektif partikel halus. |\n| **$R$ (*Relief*)** | Arah Hadap Lereng (*Aspect*) | Turunan DTM (SAGA GIS) | 0,5–8 m | Mengontrol lama penyinaran matahari pagi/sore, suhu tanah harian, dan siklus pembasahan-pengeringan (*wetting-drying*). |\n| **$R$ (*Relief*)** | Kelengkungan Umum (*Curvature*) | Turunan DTM (SAGA GIS) | 0,5–8 m | Memisahkan morfologi lereng cembung (zona pengikisan) dari lereng cekung (zona penumpukan sedimen halus). |\n| **$R$ (*Relief*)** | *Profile Curvature* | Turunan DTM (SAGA GIS) | 0,5–8 m | Mengatur percepatan (cembung) dan perlambatan (cekung) aliran air searah kemiringan lereng maksimum. |\n| **$R$ (*Relief*)** | *Plan Curvature* | Turunan DTM (SAGA GIS) | 0,5–8 m | Mengatur divergensi (penyebaran) dan konvergensi (pemusatan) aliran air secara melintang lereng. |\n| **$R$ (*Relief*)** | *Topographic Wetness Index* ($\\text{TWI}$) | Turunan DTM (SAGA GIS) | 0,5–8 m | Mengukur kecenderungan pengumpulan air tanah dangkal $\\ln(a / \\tan \\beta)$ pada kaki lereng dan cekungan lembah. |\n| **$R$ (*Relief*)** | *Topographic Position Index* ($\\text{TPI}$) | Turunan DTM (SAGA GIS) | 0,5–8 m | Mengkuantifikasi selisih elevasi suatu piksel terhadap rata-rata ketetanggaannya (punggung bukit positif vs lembah negatif). |\n| **$R$ (*Relief*)** | *Valley Depth* | Turunan DTM (SAGA GIS) | 0,5–8 m | Mengukur jarak vertikal dari suatu piksel ke permukaan interpolasi puncak-puncak punggungan di sekitarnya. |\n| **$R$ (*Relief*)** | *Channel Network Base Level* ($\\text{CNBL}$) | Turunan DTM (SAGA GIS) | 0,5–8 m | Menentukan elevasi dasar jaringan saluran tempat sedimen koluvial dan aluvial terakumulasi. |\n| **$R$ (*Relief*)** | Faktor Lereng ($\\text{LS Factor}$) | Turunan DTM (SAGA GIS) | 0,5–8 m | Mengukur kapasitas transpor sedimen erosi berdasarkan kombinasi panjang dan kemiringan lereng. |\n| **$R$ (*Relief*)** | $\\text{MrVBF}$ | Turunan DTM (SAGA GIS) | 0,5–8 m | Mengidentifikasi kemendataran dan keterhubungan dasar lembah aluvial-koluvial pada berbagai skala resolusi. |\n| **$R$ (*Relief*)** | $\\text{MrRTF}$ | Turunan DTM (SAGA GIS) | 0,5–8 m | Mengidentifikasi dataran puncak punggungan stabil tempat pelapukan *in-situ* menghasilkan horison lempung tebal. |\n| **$R$ (*Relief*)** | Bentuklahan (*Landform*) | Klasifikasi TPI / Geomorfik | 0,5–8 m | Mengelompokkan unit geomorfik diskret (puncak, lereng atas, lereng tengah, kaki lereng, lembah aluvial). |\n| **$P$ (*Parent Material*)** | Satuan Material Tutupan | Peta Geologi Lokal (Malik, 2017) | 1:25.000 | Membedakan breksi vulkanik Formasi Kebobutak/Sumbing Tua, tuf pasiran, dan endapan Sumbing Muda/longsoran. |\n| **$N$ (*Space*)** | Jarak terhadap Sungai | Analisis Jarak Euklides | 0,5–8 m | Mengukur kedekatan piksel dengan alur sungai sebagai proksi dinamika luapan banjir dan sortasi sedimen lateral. |\nSumber: Disintesis dari Fatmawati (2026), Malik (2017), dan McBratney et al. (2003)\n\nPenyusunan tumpukan kovariat (*covariate stack*) dari berbagai sensor yang memiliki resolusi spasial berbeda—mulai dari DTM LiDAR beresolusi sub-meter, citra Sentinel-2A beresolusi 10 m dan 20 m, hingga peta geologi berskala 1:25.000—memerlukan prosedur penyelarasan grid (*raster alignment* dan *resampling*) yang ketat. Seluruh layer kovariat wajib diproyeksikan ke dalam sistem koordinat proyeksi metrik yang sama (untuk Sub-DAS Bompon digunakan **WGS 84 / UTM Zone 49S, EPSG:32749**), memiliki titik asal sudut piksel (*pixel origin*) yang berimpit sempurna, serta memiliki ukuran sel (*cell size*) dan dimensi baris-kolom yang identik. Kovariat kontinu seperti elevasi, kemiringan lereng, $\\text{TWI}$, dan indeks spektral diinterpolasi menggunakan metode *bilinear interpolation* atau *cubic convolution* agar gradien nilai antar-piksel tetap mulus tanpa artefak tangga (*staircase artifact*), sedangkan kovariat kategorikal seperti kelas penggunaan lahan, bentuklahan, dan satuan material tutupan wajib diinterpolasi menggunakan metode *nearest neighbor* agar kode bilangan bulat (*integer*) kelas tidak berubah menjadi angka pecahan yang tidak memiliki makna tematik (Hengl et al., 2018).\n\nDi Sub-DAS Bompon, tanah berkembang di atas tiga satuan material tutupan utama yang mengendalikan variasi dasar sifat fisik dan kimia tanah (Malik, 2017; Fatmawati, 2026): (1) satuan breksi vulkanik tua di bagian selatan dan perbukitan struktural-denudasional yang telah mengalami pelapukan lanjut (*advanced tropic weathering*), (2) satuan tuf pasiran di bagian tengah-timur yang menyumbangkan fraksi pasir dan debu lebih tinggi ketika tererosi, serta (3) satuan endapan Gunung Sumbing Muda dan endapan longsoran di bagian utara yang relatif lebih segar. Karakteristik laboratorium dari 50 titik sampel tanah pada Lapisan 1 ($0\\text{--}20\\text{ cm}$) dan Lapisan 2 ($20\\text{--}40\\text{ cm}$) membuktikan intensitas pelapukan tropis tersebut: reaksi tanah tergolong masam dengan rata-rata $\\text{pH H}_2\\text{O}$ sebesar $5,20$ (rentang $4,46\\text{--}6,17$) pada Lapisan 1 dan $5,23$ (rentang $4,43\\text{--}6,08$) pada Lapisan 2; kandungan C-organik tergolong rendah dengan rata-rata $1,13\\%$ (rentang $0,23\\text{--}2,00\\%$) pada Lapisan 1 dan menurun menjadi $0,92\\%$ (rentang $0,29\\text{--}1,60\\%$) pada Lapisan 2; serta berat volume (*bulk density*) berada pada kisaran gembur hingga sedang yakni rata-rata $0,94\\text{ g/cm}^3$ pada Lapisan 1 dan $0,92\\text{ g/cm}^3$ pada Lapisan 2 dengan kadar lengas rata-rata $22,90\\%$ dan $23,03\\%$ (Fatmawati, 2026).\n\nTemuan pedologis yang sangat penting dari analisis laboratorium di Sub-DAS Bompon adalah kontras antara tingginya kadar fraksi lempung dan rendahnya Kapasitas Pertukaran Kation (KPK). Fraksi lempung mendominasi secara mutlak matriks tanah dengan rata-rata $62,48\\%$ (rentang $38,97\\text{--}82,73\\%$) pada Lapisan 1 dan meningkat menjadi $64,78\\%$ (rentang $44,49\\text{--}82,24\\%$) pada Lapisan 2, diikuti oleh fraksi debu dengan rata-rata $21,09\\%$ pada Lapisan 1 dan $19,54\\%$ pada Lapisan 2, serta fraksi pasir yang paling rendah dengan rata-rata $16,43\\%$ pada Lapisan 1 dan $15,68\\%$ pada Lapisan 2. Meskipun kadar lempung melampaui $60\\%$, rata-rata nilai KPK tanah justru tergolong rendah, yakni hanya $8,99\\text{ cmol(+)/kg}$ (rentang $3,67\\text{--}19,93\\text{ cmol(+)/kg}$) pada Lapisan 1 dan $9,22\\text{ cmol(+)/kg}$ (rentang $4,82\\text{--}20,16\\text{ cmol(+)/kg}$) pada Lapisan 2 (Fatmawati, 2026). Bila dihitung rasio aktivitas lempungnya ($\\text{KPK}_{\\text{lempung}} \\approx \\text{KPK}_{\\text{tanah}} / \\text{fraksi lempung}$), diperoleh nilai sekitar $14,2\\text{--}14,4\\text{ cmol(+)/kg lempung}$. Nilai aktivitas lempung di bawah $16\\text{ cmol(+)/kg}$ dengan kondisi $\\text{pH}$ masam ($\\sim 5,2$) dan kandungan bahan organik rendah ($\\sim 1,0\\%$) mengonfirmasi bahwa mineralogi lempung di Sub-DAS Bompon didominasi oleh **mineral lempung beraktivitas rendah tipe 1:1 (kaolinit dan haloisit)** serta seskuioksida besi-aluminium ($\\text{Fe/Al-oksida}$), bukan smektit/montmorilonit tipe 2:1. Kenyataan pedogenetik inilah yang menjelaskan mengapa kovariat topografi pengatur erosi-sedimentasi ($R$) dan indeks spektral serapan lempung hidroksil ($S$) menjadi prediktor kunci dalam pemodelan DSM di wilayah ini.\n\n---\n\n## Algoritma Digital Soil Mapping\n\nHubungan fungsional $f(\\cdot)$ antara sifat tanah dengan 22 kovariat lingkungan $\\text{SCORPAN}$ di bentang lahan tropis yang kompleks hampir selalu bersifat nonlinier, melibatkan interaksi orde tinggi antar-variabel (misalnya pengaruh kemiringan lereng terhadap tekstur sangat bergantung pada jenis tutupan lahan dan satuan litologi), serta mengandung multikolinearitas yang kuat di antara sesama turunan DTM. Model regresi linier berganda (*Multiple Linear Regression*) atau kriging regresi linier sering gagal menangkap ambang batas geomorfik (*geomorphic thresholds*) yang tajam, seperti perubahan mendadak fraksi pasir dan debu pada peralihan lereng curam ke dataran kaki lereng koluvial. Oleh sebab itu, pemodelan DSM modern mengandalkan keluarga algoritma pembelajaran mesin nonparametrik berbasis pohon keputusan (*tree-based ensemble algorithms*) yang mampu mempartisi ruang fitur secara adaptif tanpa asumsi distribusi parametrik (Breiman, 2001; Meinshausen, 2006; Prokhorenkova et al., 2018). Empat arsitektur algoritma utama yang diterapkan dan dibandingkan secara langsung pada studi kasus Sub-DAS Bompon disajikan pada Gambar 8.2.\n\n![](assets/modul-8/M8-G02_komparasi-algoritma-rf-qrf-catboost-stacking.png)\nGambar 8.2 Perbandingan mekanisme matematis dan peran komplementer empat algoritma pembelajaran mesin dalam *Digital Soil Mapping*: (a) *Random Forest*, (b) *Quantile Regression Forest*, (c) *CatBoost*, dan (d) *Stacking Ensemble*\nSumber: Disintesis dari Breiman (2001), Meinshausen (2006), Prokhorenkova et al. (2018), dan Fatmawati (2026)\n\n### 1. Random Forest (RF)\n\nDiperkenalkan oleh Breiman (2001), *Random Forest* (RF) merupakan algoritma ansambel berbasis *bootstrap aggregating* (*bagging*) yang menggabungkan prediksi dari sejumlah besar pohon regresi keputusan independen $\\{T_b(\\mathbf{x})\\}_{b=1}^B$. Mekanisme kerja RF bertumpu pada dua sumber pengacakan utama untuk mendekorelasikan pohon-pohon penyusunnya:\n\n1. **Penarikan sampel *bootstrap* (*row subsampling*)**: Setiap pohon ke-$b$ dilatih menggunakan himpunan data $\\mathcal{D}_b$ berukuran $N$ yang ditarik secara acak dengan pengembalian (*sampling with replacement*) dari himpunan data asli $\\mathcal{D} = \\{(\\mathbf{x}_i, y_i)\\}_{i=1}^N$. Secara teoretis, peluang suatu pengamatan tidak terpilih ke dalam sampel *bootstrap* pada satu pohon adalah $(1 - 1/N)^N \\approx e^{-1} \\approx 0,368$. Dengan demikian, sekitar $63,2\\%$ pengamatan masuk ke dalam himpunan latih pohon (*in-bag samples*), sedangkan sekitar $36,8\\%$ sisanya menjadi sampel *Out-of-Bag* ($\\text{OOB}$) yang dapat digunakan untuk mengestimasi galat generalisasi internal serta menghitung tingkat kepentingan variabel (*permutation feature importance*).\n2. **Pemilihan acak subset fitur pada setiap simpul (*column/feature subsampling*)**: Pada setiap simpul percabangan (*node*) di dalam pohon, algoritma tidak memeriksa seluruh $P$ kovariat yang tersedia, melainkan hanya memilih secara acak subset berukuran $m_{\\text{try}}$ kovariat (untuk regresi umumnya ditetapkan $m_{\\text{try}} = \\lfloor P/3 \\rfloor$ atau $\\lfloor \\sqrt{P} \\rfloor$). Dari $m_{\\text{try}}$ kandidat tersebut, dipilih variabel $x_j$ dan nilai ambang batas (*split point*) $s$ yang meminimumkan jumlah kuadrat galat (*Residual Sum of Squares*, $\\text{RSS}$) pada dua simpul anak yang terbentuk, yaitu $R_1(j, s) = \\{\\mathbf{x} \\mid x_j \\le s\\}$ dan $R_2(j, s) = \\{\\mathbf{x} \\mid x_j \u003e s\\}$:\n\n$$\\min_{j \\in \\{1, \\dots, m_{\\text{try}}\\}, \\, s} \\left[ \\sum_{\\mathbf{x}_i \\in R_1(j, s)} (y_i - \\bar{y}_{R_1})^2 + \\sum_{\\mathbf{x}_i \\in R_2(j, s)} (y_i - \\bar{y}_{R_2})^2 \\right]$$\n\nPrediksi akhir RF pada lokasi piksel baru $\\mathbf{x}_0$ diperoleh melalui perata-rataan aritmetika dari prediksi nilai tengah seluruh $B$ pohon keputusan:\n\n$$\\hat{y}_{\\text{RF}}(\\mathbf{x}_0) = \\frac{1}{B} \\sum_{b=1}^{B} T_b(\\mathbf{x}_0)$$\n\nKeunggulan utama RF dalam DSM terletak pada kemampuannya menekan varians prediksi ($\\text{Var}(\\hat{y}) = \\rho \\sigma^2 + \\frac{1-\\rho}{B}\\sigma^2$, dengan $\\rho$ adalah korelasi antar-pohon) tanpa meningkatkan bias, ketahanannya terhadap pencilan (*outliers*) serta multikolinearitas antar-kovariat topografi, dan kemampuannya menangani kovariat kontinu maupun kategorikal secara simultan (Hengl et al., 2018). Namun, karena prediksi RF merupakan rata-rata dari rata-rata simpul daun, nilai prediksi $\\hat{y}_{\\text{RF}}(\\mathbf{x}_0)$ selalu terikat di dalam rentang minimum dan maksimum data latih ($\\min(y_i) \\le \\hat{y}_{\\text{RF}}(\\mathbf{x}_0) \\le \\max(y_i)$), sehingga RF tidak dapat melakukan ekstrapolasi di luar domain pengamatan dan cenderung mempersempit prediksi pada nilai ekstrem (*smoothing of tails*).\n\n### 2. Quantile Regression Forest (QRF)\n\nMeskipun RF memberikan penaksir nilai harapan bersyarat $E(Y \\mid \\mathbf{X} = \\mathbf{x}_0)$ yang stabil, RF membuang informasi mengenai sebaran variasi pengamatan di dalam setiap simpul daun karena hanya menyimpan nilai rata-rata daun. Meinshausen (2006) mengembangkan *Quantile Regression Forest* (QRF) sebagai generalisasi nonparametrik dari RF untuk mengestimasi keseluruhan fungsi distribusi kumulatif bersyarat $F(y \\mid \\mathbf{X} = \\mathbf{x}_0) = P(Y \\le y \\mid \\mathbf{X} = \\mathbf{x}_0)$.\n\nDalam algoritma QRF, pohon-pohon keputusan dibangun persis seperti pada RF, tetapi setiap simpul daun $\\ell_b(\\mathbf{x}_0)$ menyimpan seluruh nilai observasi asli $y_i$ yang jatuh ke dalam daun tersebut. Untuk suatu piksel target $\\mathbf{x}_0$, QRF menghitung bobot kesamaan (*similarity weight*) $w_i(\\mathbf{x}_0)$ bagi setiap titik sampel pelatihan ke-$i$ ($i = 1, \\dots, N$). Pada pohon ke-$b$, bobot titik ke-$i$ bernilai positif apabila titik sampel $\\mathbf{x}_i$ jatuh ke dalam simpul daun yang sama dengan piksel target $\\mathbf{x}_0$:\n\n$$w_{i, b}(\\mathbf{x}_0) = \\frac{\\mathbb{I}\\{\\mathbf{x}_i \\in \\ell_b(\\mathbf{x}_0)\\}}{\\#\\{k : \\mathbf{x}_k \\in \\ell_b(\\mathbf{x}_0)\\}}, \\qquad w_i(\\mathbf{x}_0) = \\frac{1}{B} \\sum_{b=1}^{B} w_{i, b}(\\mathbf{x}_0)$$\n\ndengan $\\sum_{i=1}^{N} w_i(\\mathbf{x}_0) = 1$. Berdasarkan bobot kesamaan tersebut, fungsi distribusi kumulatif bersyarat pada piksel $\\mathbf{x}_0$ ditaksir secara empiris sebagai:\n\n$$\\hat{F}(y \\mid \\mathbf{X} = \\mathbf{x}_0) = \\sum_{i=1}^{N} w_i(\\mathbf{x}_0) \\, \\mathbb{I}\\{y_i \\le y\\}$$\n\nKuantil prediksi ke-$\\tau$ (untuk $\\tau \\in (0, 1)$, misalnya kuantil bawah $\\tau = 0,05$, median $\\tau = 0,50$, dan kuantil atas $\\tau = 0,95$) diperoleh dengan mengambil infimum nilai $y$ yang memenuhi $\\hat{F}(y \\mid \\mathbf{X} = \\mathbf{x}_0) \\ge \\tau$:\n\n$$\\hat{q}_{\\tau}(\\mathbf{x}_0) = \\inf \\left\\{ y \\in \\mathbb{R} : \\hat{F}(y \\mid \\mathbf{X} = \\mathbf{x}_0) \\ge \\tau \\right\\}$$\n\nDi dalam standar global pemetaan tanah digital seperti *GlobalSoilMap* (Arrouays et al., 2014; Vaysse dan Lagacherie, 2017), QRF memegang peran sentral karena mampu menghasilkan peta batas bawah ($\\hat{q}_{0,05}$) dan batas atas ($\\hat{q}_{0,95}$) selang kepercayaan prediksi $90\\%$ secara langsung pada setiap piksel tanpa mengasumsikan galat berdistribusi normal homoskedastik. Akan tetapi, apabila dievaluasi sebagai penaksir tunggal pada ukuran sampel kecil ($N = 50$), QRF memiliki kecenderungan menghasilkan metrik $R^2$ validasi silang yang lebih rendah dibandingkan RF atau *boosting* karena penaksiran berbasis kuantil empiris pada simpul daun yang hanya memuat sedikit pengamatan lebih rentan terhadap varians lokal (Fatmawati, 2026).\n\n### 3. CatBoost (Categorical Boosting)\n\nBerbeda dari RF dan QRF yang membangun pohon secara paralel dan independen (*bagging*), keluarga algoritma *Gradient Boosted Decision Trees* (GBDT) membangun pohon secara sekuensial (berurutan), yakni pohon ke-$m$ dilatih secara khusus untuk memprediksi dan mengoreksi gradien negatif dari fungsi kerugian (*loss function*) atau residual dari ansambel pohon sebelumnya $F_{m-1}(\\mathbf{x})$:\n\n$$F_m(\\mathbf{x}) = F_{m-1}(\\mathbf{x}) + \\eta \\, h_m(\\mathbf{x})$$\n\ndengan $\\eta \\in (0, 1]$ adalah laju pembelajaran (*learning rate*) yang mengendalikan kontribusi setiap pohon baru $h_m(\\mathbf{x})$ guna mencegah *overfitting*. *CatBoost* (*Categorical Boosting*), yang dikembangkan oleh Prokhorenkova et al. (2018), menghadirkan dua inovasi fundamental yang sangat relevan bagi pemodelan DSM pada ukuran sampel terbatas dan kovariat campuran:\n\n1. **Pohon Keputusan Simetris (*Oblivious Decision Trees*)**: Berbeda dari pohon keputusan standar (CART, XGBoost, atau LightGBM) yang memilih fitur dan ambang belah secara berbeda pada setiap cabang di tingkat kedalaman yang sama, CatBoost menggunakan pohon simetris (*oblivious trees*). Pada pohon simetris dengan kedalaman $d$, seluruh simpul pada tingkat kedalaman ke-$k$ ($k = 1, \\dots, d$) wajib menggunakan **pasangan fitur dan ambang batas pembelahan $(x_{j_k}, s_k)$ yang sama**. Pohon simetris dengan kedalaman $d$ selalu menghasilkan tepat $2^d$ simpul daun yang dapat dievaluasi sebagai tabel kebenaran biner. Struktur simetris ini bertindak sebagai regularisasi struktural alami yang sangat kuat, sehingga mencegah pohon menghafal kombinasi fitur spesifik dari satu atau dua titik sampel pencilan.\n2. ***Ordered Boosting* dan *Ordered Target Statistics***: Pada GBDT konvensional, gradien residual pada iterasi ke-$m$ dihitung menggunakan model $F_{m-1}$ yang dilatih pada titik data yang sama. Pada ukuran sampel kecil (seperti $N = 50$ di Sub-DAS Bompon), hal ini menimbulkan pergeseran distribusi gradien (*prediction shift* atau *target leakage*) yang menyebabkan model mengalami *overfitting* parah. CatBoost mengatasi masalah tersebut dengan membangkitkan permutasi acak urutan sampel $\\sigma = (\\sigma_1, \\dots, \\sigma_N)$ dan menghitung residual bagi sampel ke-$\\sigma_i$ hanya menggunakan model pendukung yang dilatih pada sampel-sampel pendahulunya $\\{\\sigma_1, \\dots, \\sigma_{i-1}\\}$. Prinsip *ordered statistics* yang sama juga digunakan ketika mengubah kovariat kategorikal (seperti kelas penggunaan lahan, bentuklahan, dan satuan litologi bahan induk) menjadi nilai numerik target rata-rata tanpa membocorkan nilai target titik itu sendiri (Prokhorenkova et al., 2018).\n\n### 4. Stacking Ensemble (Stacked Generalization)\n\nSetiap algoritma tunggal memiliki bias induktif masing-masing: RF unggul dalam menekan varians melalui perata-rataan pohon mendalam, QRF peka terhadap median dan sebaran lokal, sedangkan CatBoost unggul dalam menurunkan bias prediksi melalui koreksi residual sekuensial pada pohon simetris dangkal. Wolpert (1992) memperkenalkan kerangka *Stacked Generalization* (*Stacking Ensemble*) untuk menggabungkan kekuatan berbagai algoritma heterogen tersebut ke dalam arsitektur dua aras (*two-level meta-learning*):\n\n1. **Pembelajar Aras-0 (*Level-0 Base Learners*)**: Himpunan $K$ algoritma dasar yang berbeda karakter—dalam studi Sub-DAS Bompon terdiri atas $K = 3$ algoritma yakni RF ($k=1$), QRF ($k=2$), dan CatBoost ($k=3$)—dilatih pada matriks fitur kovariat $\\mathbf{X}$. Agar model aras kedua tidak sekadar memberikan bobot terbesar kepada model dasar yang paling *overfit* terhadap data latih, matriks prediksi aras pertama $\\mathbf{Z} \\in \\mathbb{R}^{N \\times K}$ wajib dibangkitkan melalui mekanisme prediksi di luar lipatan (*out-of-fold predictions*) menggunakan validasi silang. Untuk setiap titik sampel ke-$i$ yang berada pada lipatan uji $\\mathcal{V}_f$, prediksi $\\hat{y}_{i}^{(k)} = \\hat{f}_{k}^{(-f)}(\\mathbf{x}_i)$ dihasilkan oleh model dasar ke-$k$ yang dilatih tanpa menyertakan lipatan $\\mathcal{V}_f$.\n2. **Pembelajar Aras-1 (*Level-1 Meta-Learner / Blender*)**: Sebuah model regresi meta (umumnya regresi linier berpenalti *Ridge* / *Lasso* atau regresi linier terkendala non-negatif) dilatih menggunakan matriks prediksi *out-of-fold* $\\mathbf{Z} = [\\hat{\\mathbf{y}}^{(1)}, \\hat{\\mathbf{y}}^{(2)}, \\hat{\\mathbf{y}}^{(3)}]$ sebagai variabel penjelas untuk memprediksi vektor observasi sejati $\\mathbf{y}$:\n\n$$\\hat{y}_{\\text{Stacking}}(\\mathbf{x}_0) = \\alpha_0 + \\sum_{k=1}^{K} \\alpha_k \\, \\hat{f}_k(\\mathbf{x}_0)$$\n\ndengan $\\alpha_0$ adalah konstanta intersep dan $\\alpha_k$ adalah bobot kontribusi optimal bagi model dasar ke-$k$ yang meminimumkan fungsi kerugian kuadrat terkecil berpenalti:\n\n$$\\min_{\\alpha_0, \\boldsymbol{\\alpha}} \\sum_{i=1}^{N} \\left( y_i - \\alpha_0 - \\sum_{k=1}^{K} \\alpha_k \\, \\hat{y}_{i}^{(k)} \\right)^2 + \\lambda \\sum_{k=1}^{K} \\alpha_k^2$$\n\nSecara matematis, kombinasi ansambel *stacking* menjamin galat kuadrat tengah harapan yang lebih kecil atau sama dengan model dasar terbaik apabila kesalahan prediksi antar-model dasar tidak berkorelasi sempurna (Breiman, 1996; Taghizadeh-Mehrjardi et al., 2020). Sebagaimana akan dibuktikan pada bagian validasi empiris di Sub-DAS Bompon, *Stacking Ensemble* secara konsisten melampaui akurasi ketiga model dasarnya pada seluruh fraksi tekstur dan seluruh lapisan kedalaman tanah (Fatmawati, 2026).\n\n---\n\n## Data Splitting\n\nTahapan krusial sebelum melatih algoritma pembelajaran mesin adalah merancang strategi pemisahan data (*data splitting*) dan prapemrosesan distribusi target agar evaluasi model mencerminkan kemampuan generalisasi yang jujur serta tidak terbias oleh ketimpangan distribusi sampel. Dalam survei tanah operasional di daerah aliran sungai mikro hingga menengah, jumlah titik sampel laboratorium hampir selalu dibatasi oleh anggaran biaya analisis dan aksesibilitas medan (umumnya berkisar antara $N = 30$ hingga $N = 100$ titik). Di Sub-DAS Bompon, tersedia $N = 50$ titik pengamatan yang masing-masing diambil pada dua kedalaman (Lapisan 1: $0\\text{--}20\\text{ cm}$ dan Lapisan 2: $20\\text{--}40\\text{ cm}$).\n\n### 1. Hold-out Split versus Cross-Validation (k-Fold, LOOCV, dan Spatial Block CV)\n\nPendekatan pemisahan tunggal (*hold-out split*), misalnya membagi data secara acak menjadi $70\\%$ data latih ($35$ titik) dan $30\\%$ data uji ($15$ titik), sangat tidak dianjurkan pada ukuran sampel $N = 50$. Pertama, kehilangan $15$ titik dari himpunan pelatihan akan memangkas keterwakilan kombinasi kovariat geomorfik secara drastis. Kedua, nilai metrik evaluasi ($R^2$ dan $\\text{RMSE}$) yang dihitung hanya dari $15$ titik uji sangat tidak stabil dan bergantung penuh pada kebetulan penarikan angka acak (*random seed*) apakah titik pencilan jatuh ke himpunan latih atau himpunan uji (Brus et al., 2011; Wadoux et al., 2021).\n\nUntuk mengatasi keterbatasan ukuran sampel tersebut, pemodelan DSM menggunakan prosedur validasi silang (*cross-validation*, CV) sebagaimana diilustrasikan pada Gambar 8.3(a):\n\n1. ***k-Fold Cross-Validation***: Himpunan data $\\mathcal{D}$ berukuran $N$ dibagi secara acak (atau terstratifikasi menurut kuantil target) menjadi $k$ lipatan (*folds*) berukuran sama (umumnya $k = 5$ atau $k = 10$). Pada iterasi ke-$f$ ($f = 1, \\dots, k$), sebanyak $k-1$ lipatan digunakan untuk melatih model dan $1$ lipatan sisanya digunakan untuk menguji model. Proses ini diulang sebanyak $k$ kali sehingga seluruh $N$ titik sampel pernah berperan tepat satu kali sebagai titik uji di luar sampel pelatihan.\n2. ***Leave-One-Out Cross-Validation* (LOOCV)**: Kasus khusus dari *k-Fold CV* ketika jumlah lipatan ditetapkan sama dengan jumlah sampel ($k = N = 50$). Pada setiap iterasi ke-$i$ ($i = 1, \\dots, 50$), model dilatih menggunakan $N - 1 = 49$ titik sampel dan diuji pada $1$ titik sampel ke-$i$ yang disisihkan:\n\n$$\\hat{y}_{(-i)} = \\hat{f}_{(-i)}(\\mathbf{x}_i), \\qquad e_{(-i)} = y_i - \\hat{y}_{(-i)}$$\n\nKeunggulan utama LOOCV pada dataset berukuran $N = 50$ adalah pemanfaatan informasi pelatihan yang maksimum ($98\\%$ data digunakan pada setiap iterasi) sehingga bias estimasi kinerja menjadi sangat kecil, serta sifatnya yang deterministik (tidak bergantung pada pengacakan partisi lipatan). Dalam penelitiannya, Fatmawati (2026) menerapkan skema LOOCV untuk mengevaluasi seluruh model tekstur tanah di Sub-DAS Bompon agar setiap titik lapangan menyumbangkan informasi pedogenetik secara optimal.\n3. ***Spatial Block Cross-Validation* (Validasi Silang Berblok Spasial)**: Dalam pemetaan geospasial, titik-titik sampel yang berdekatan secara geografis cenderung memiliki nilai sifat tanah yang mirip akibat autokorelasi spasial (Hukum Pertama Geografi Tobler). Apabila desain pengambilan sampel di lapangan bersifat mengelompok (*clustered sampling*) dan validasi silang dilakukan secara acak murni (*random CV*), titik uji hampir pasti dikelilingi oleh titik latih dalam jarak beberapa puluh meter. Hal ini memicu kebocoran autokorelasi spasial (*spatial autocorrelation leakage*) yang menghasilkan estimasi $R^2$ terlalu optimis (Roberts et al., 2017; Ploton et al., 2020; Meyer dan Pebesma, 2021). Pada kondisi sampel mengelompok, partisi lipatan wajib dilakukan berdasarkan blok-blok ruang (*spatial blocks* atau klaster koordinat *k-means*) sehingga terdapat jarak penyangga antara lipatan latih dan lipatan uji. Sebaliknya, apabila desain survei lapangan sejak awal telah disusun secara menyebar merata berbasis probabilitas atau stratifikasi ruang kovariat (seperti *Conditioned Latin Hypercube Sampling* yang dipelajari pada Modul 2), Brus et al. (2011) dan Wadoux et al. (2021) menunjukkan bahwa validasi silang standar memberikan taksiran akurasi pemetaan yang tidak berbias terhadap populasi wilayah kajian.\n\n![](assets/modul-8/M8-G03_skema-validasi-dan-resampling-smogn.png)\nGambar 8.3 Skema pemisahan data dan penyeimbangan distribusi target dalam pemodelan DSM: (a) struktur iterasi validasi silang (*k-Fold* / LOOCV) dan prinsip *Spatial Block CV*, serta (b) transformasi kerapatan distribusi fraksi lempung melalui teknik *oversampling* SMOGN dan gejala penghalusan ekor distribusi prediksi\nSumber: Disintesis dari Branco et al. (2017), Roberts et al. (2017), dan Fatmawati (2026)\n\n### 2. Ketimpangan Distribusi Target dan Resampling SMOGN\n\nTantangan klasik dalam pemodelan regresi tanah adalah ketidakseimbangan (*imbalance*) distribusi variabel target kontinu. Di Sub-DAS Bompon, pelapukan intensif breksi vulkanik menyebabkan sebagian besar sampel tanah berkumpul pada kisaran lempung sangat tinggi ($58\\text{--}72\\%$) dan pasir rendah ($10\\text{--}20\\%$), sedangkan sampel yang mewakili tanah bertekstur lempung-berpasir atau berdebu tinggi (misalnya lempung $\u003c 48\\%$ atau pasir $\u003e 26\\%$ pada singkapan tuf pasiran dan tebing longsoran) jumlahnya sangat sedikit dan berada pada ekor distribusi (*distribution tails*). Karena algoritma RF, QRF, dan CatBoost meminimumkan rata-rata galat kuadrat di seluruh sampel, model akan memusatkan kapasitas pembelajarannya pada nilai mayoritas di sekitar rata-rata ($\\bar{y}$) dan mengabaikan pengamatan langka pada ekor distribusi.\n\nUntuk menanggulangi ketimpangan regresi tersebut, Branco et al. (2017) mengembangkan algoritma **SMOGN** (*Synthetic Minority Over-sampling Technique for Regression with Gaussian Noise*), yang merupakan perluasan dari metode SMOTE dan SMOTER untuk variabel respon kontinu $Y$. Sebagaimana diilustrasikan pada Gambar 8.3(b), tahapan matematis SMOGN bekerja sebagai berikut:\n\n1. **Fungsi Relevansi $\\phi(y)$ dan Pemisahan Partisi $\\mathcal{D}_R$ vs $\\mathcal{D}_N$**: Suatu fungsi relevansi kontinu $\\phi : \\mathcal{Y} \\to [0, 1]$ didefinisikan berdasarkan kuantil ekstrem atau kerapatan distribusi empiris variabel target $Y$. Nilai $y_i$ yang berada di dekat pusat distribusi (sekitar median/kuartil tengah) diberi relevansi mendekati $0$, sedangkan nilai $y_i$ yang berada pada ekor distribusi yang jarang diberi relevansi mendekati $1$. Dengan menetapkan ambang batas relevansi $t_R$ (misalnya $t_R = 0,80$), himpunan data latih dipartisi menjadi dua himpunan saling asing: himpunan kasus normal/mayoritas $\\mathcal{D}_N = \\{(\\mathbf{x}_i, y_i) \\mid \\phi(y_i) \u003c t_R\\}$ dan himpunan kasus langka/ekstrem $\\mathcal{D}_R = \\{(\\mathbf{x}_i, y_i) \\mid \\phi(y_i) \\ge t_R\\}$.\n2. ***Random Under-sampling* pada Himpunan Mayoritas ($\\mathcal{D}_N$)**: Sebagian pengamatan di dalam $\\mathcal{D}_N$ yang terlalu padat di sekitar nilai tengah dikurangi secara acak terstratifikasi sehingga dominasi nilai rata-rata menurun.\n3. ***Synthetic Over-sampling* Hibrida (SMOTER + *Gaussian Noise*) pada Himpunan Langka ($\\mathcal{D}_R$)**: Bagi setiap titik kasus langka $(\\mathbf{x}_i, y_i) \\in \\mathcal{D}_R$, dicari $k$ tetangga terdekatnya di dalam ruang fitur $\\mathcal{D}_R$ berdasarkan jarak euklides $d(\\mathbf{x}_i, \\mathbf{x}_j)$. Karena jumlah titik di $\\mathcal{D}_R$ sangat sedikit, tetangga terdekat yang terpilih $(\\mathbf{x}_{\\text{nn}}, y_{\\text{nn}})$ bisa jadi sebenarnya berada cukup jauh sehingga interpolasi linier di antaranya berisiko jatuh ke zona mayoritas. Oleh karena itu, SMOGN menghitung ambang jarak aman maksimum $d_{\\text{max}} = \\frac{1}{2} \\text{median}\\{d(\\mathbf{x}_i, \\mathbf{x}_m)\\}_{m \\in \\mathcal{D}_R}$ dan menerapkan aturan percabangan:\n   - **Interpolasi SMOTER (jika $d(\\mathbf{x}_i, \\mathbf{x}_{\\text{nn}}) \u003c d_{\\text{max}}$)**: Apabila tetangga terpilih cukup dekat dan aman, titik sintetis baru $(\\mathbf{x}_{\\text{new}}, y_{\\text{new}})$ dibangkitkan melalui interpolasi linier dengan bilangan acak $u \\sim \\text{Uniform}(0, 1)$ pada ruang fitur dan rata-rata tertimbang jarak pada variabel target:\n\n$$\\mathbf{x}_{\\text{new}} = \\mathbf{x}_i + u \\, (\\mathbf{x}_{\\text{nn}} - \\mathbf{x}_i), \\qquad y_{\\text{new}} = \\frac{w_1 y_i + w_2 y_{\\text{nn}}}{w_1 + w_2}$$\n\n   dengan bobot $w_1 = 1 / d(\\mathbf{x}_{\\text{new}}, \\mathbf{x}_i)$ dan $w_2 = 1 / d(\\mathbf{x}_{\\text{new}}, \\mathbf{x}_{\\text{nn}})$.\n   - **Perturbasi *Gaussian Noise* (jika $d(\\mathbf{x}_i, \\mathbf{x}_{\\text{nn}}) \\ge d_{\\text{max}}$)**: Apabila tetangga terpilih terlalu jauh, interpolasi dibatalkan dan digantikan dengan penambahan derau Gauss bervarians kecil di sekitar titik $(\\mathbf{x}_i, y_i)$ itu sendiri dengan simpangan baku gangguan $\\sigma_{\\text{pert}} = \\min(0,02, \\, 0,5 \\cdot d_{\\text{max}})$:\n\n$$x_{\\text{new}, j} = x_{i, j} + \\mathcal{N}(0, \\, \\sigma_{\\text{pert}}^2 \\cdot s_{x_j}^2), \\qquad y_{\\text{new}} = y_i + \\mathcal{N}(0, \\, \\sigma_{\\text{pert}}^2 \\cdot s_{y}^2)$$\n\nPrinsip metodologis yang **wajib dipatuhi** ketika menerapkan SMOGN di dalam alur validasi silang adalah bahwa **pembentukan sampel sintetis SMOGN hanya boleh dikenakan pada lipatan data latih ($\\mathcal{D}_{\\text{train}}$) di dalam setiap iterasi validasi silang**, dan sama sekali tidak boleh dikenakan pada seluruh dataset sebelum pemisahan data uji ($\\mathcal{D}_{\\text{test}}$). Apabila SMOGN dijalankan sebelum pemisahan data latih dan uji, titik sintetis yang merupakan duplikat berderau kecil dari titik uji akan masuk ke dalam data latih, sehingga menyebabkan kebocoran data (*data leakage*) dan menggelembungkan nilai $R^2$ secara semu (Vandewiele et al., 2021).\n\n---\n\n## Pembuatan Model dan Validasi\n\nTahap pembuatan model mengintegrasikan penyaringan prediktor (*feature selection*), penyetelan hiperparameter (*hyperparameter tuning*), pelatihan model dasar serta *meta-model stacking*, dan evaluasi kinerja menggunakan metrik kuantitatif baku.\n\n### 1. Seleksi Kovariat dengan Recursive Feature Elimination (RFE)\n\nMemasukkan seluruh 22 kovariat lingkungan sekaligus ke dalam model yang hanya dilatih pada $N = 50$ titik sampel menimbulkan masalah *curse of dimensionality* (nisbah jumlah pengamatan terhadap jumlah prediktor hanya sekitar $2,27 : 1$). Banyak kovariat topografi turunan DTM yang membawa informasi tumpang-tindih (misalnya antara *Curvature*, *Profile Curvature*, dan *Plan Curvature*, atau antara $\\text{TPI}$, *Valley Depth*, dan $\\text{MrVBF}$). Kehadiran prediktor yang redundan atau tidak relevan akan mengencerkan peluang terpilihnya prediktor kunci pada parameter $m_{\\text{try}}$ di dalam algoritma *Random Forest* dan meningkatkan varians prediksi.\n\nDalam pemodelan di Sub-DAS Bompon, Fatmawati (2026) menerapkan algoritma **Recursive Feature Elimination (RFE)** (Guyon et al., 2002) untuk menyaring himpunan subset kovariat optimal $\\mathcal{S}^* \\subset \\{1, \\dots, 22\\}$ secara spesifik bagi setiap fraksi tekstur dan setiap lapisan kedalaman. Prosedur RFE bekerja melalui eliminasi mundur berulang (*backward elimination*):\n\n1. Model penduga awal (misalnya *Random Forest*) dilatih menggunakan seluruh himpunan kovariat $\\mathcal{S}_P = \\{1, 2, \\dots, P\\}$ ($P = 22$), kemudian dihitung skor tingkat kepentingan setiap variabel $I(x_j)$ berdasarkan rata-rata penurunan ketidakmurnian simpul (*Mean Decrease in Impurity* / penurunan $\\text{RSS}$) atau peningkatan galat permutasi $\\text{OOB}$, serta dihitung galat validasi silang $\\text{RMSE}(\\mathcal{S}_P)$.\n2. Kovariat yang memiliki skor kepentingan paling rendah, yakni $j_{\\text{min}} = \\arg\\min_{j \\in \\mathcal{S}_p} I(x_j)$, dieliminasi dari himpunan kandidat sehingga tersisa $\\mathcal{S}_{p-1} = \\mathcal{S}_p \\setminus \\{j_{\\text{min}}\\}$.\n3. Model dilatih ulang pada subset $\\mathcal{S}_{p-1}$ dan dievaluasi kembali nilai $\\text{RMSE}(\\mathcal{S}_{p-1})$. Langkah 2 dan 3 diulang secara rekursif hingga ukuran subset kandidat mencapai jumlah fitur minimum yang diuji (misalnya $p = 5, 10, 15$ kovariat).\n4. Subset kovariat terbaik $\\mathcal{S}^*$ dipilih berdasarkan nilai $\\text{RMSE}$ validasi silang terendah. Pada pemodelan tekstur tanah di Sub-DAS Bompon, RFE menghasilkan subset optimal sebanyak **5 kovariat** untuk Pasir Lapisan 1, Lempung Lapisan 1, dan Debu Lapisan 2, serta **10 kovariat** untuk Debu Lapisan 1, Pasir Lapisan 2, dan Lempung Lapisan 2 (Fatmawati, 2026).\n\n### 2. Metrik Evaluasi Validasi Silang\n\nAkurasi prediksi di luar sampel (*out-of-fold predictions* $\\hat{y}_i$ dari LOOCV terhadap nilai laboratorium sejati $y_i$ untuk $i = 1, \\dots, N$) dievaluasi menggunakan empat metrik komplementer:\n\n1. **Koefisien Determinasi Validasi Silang ($R^2$ atau *Model Efficiency Coefficient*)**: Mengukur proporsi varians data observasi yang berhasil dijelaskan oleh prediksi model relatif terhadap penggunaan nilai rata-rata sampel $\\bar{y}$ sebagai penaksir naif:\n\n$$R^2 = 1 - \\frac{\\sum_{i=1}^{N} (y_i - \\hat{y}_i)^2}{\\sum_{i=1}^{N} (y_i - \\bar{y})^2}$$\n\n   Pada evaluasi validasi silang di luar sampel, nilai $R^2$ berkisar dari $-\\infty$ hingga $1$. Nilai $R^2 = 1$ menunjukkan prediksi sempurna ($\\hat{y}_i = y_i$), nilai $R^2 = 0$ menunjukkan akurasi model setara dengan menebak nilai rata-rata $\\bar{y}$ untuk seluruh lokasi, sedangkan **nilai $R^2 \u003c 0$ (negatif)** menunjukkan bahwa varians prediksi model memiliki galat kuadrat total yang lebih besar daripada sekadar menggunakan rata-rata sampel (sering terjadi ketika model tunggal mengalami *overfitting* pada ukuran sampel kecil).\n2. ***Root Mean Square Error* ($\\text{RMSE}$)**: Mengukur akar rata-rata kuadrat galat prediksi dalam satuan asli variabel target ($\\%$ fraksi tekstur):\n\n$$\\text{RMSE} = \\sqrt{\\frac{1}{N} \\sum_{i=1}^{N} (y_i - \\hat{y}_i)^2}$$\n\n   Karena galat dikuadratkan sebelum dirata-ratakan, $\\text{RMSE}$ memberikan bobot hukuman yang lebih berat terhadap kesalahan prediksi berukuran besar (pencilan).\n3. ***Mean Absolute Error* ($\\text{MAE}$)**: Mengukur rata-rata simpangan mutlak antara observasi dan prediksi:\n\n$$\\text{MAE} = \\frac{1}{N} \\sum_{i=1}^{N} |y_i - \\hat{y}_i|$$\n\n   Selisih antara $\\text{RMSE}$ dan $\\text{MAE}$ ($\\text{RMSE} \\ge \\text{MAE}$) menjadi indikator langsung homogenitas galat: semakin jauh nilai $\\text{RMSE}$ di atas $\\text{MAE}$, semakin kuat pengaruh beberapa titik pengamatan ekstrem yang meleset jauh.\n4. ***Lin's Concordance Correlation Coefficient* ($\\text{CCC}$)**: Diperkenalkan oleh Lin (1989) dan diadopsi secara luas dalam DSM (Minasny dan McBratney, 2016), $\\text{CCC}$ mengukur sejauh mana pasangan titik $(y_i, \\hat{y}_i)$ berimpit dengan garis kesetaraan $1:1$ (garis bersudut $45^\\circ$ melalui titik asal), dengan menggabungkan ukuran kepresisian korelasi Pearson ($r$) dan ketepatan/akurasi posisi terhadap garis $1:1$:\n\n$$\\text{CCC} = \\frac{2 \\, r \\, s_y \\, s_{\\hat{y}}}{s_y^2 + s_{\\hat{y}}^2 + (\\bar{y} - \\bar{\\hat{y}})^2}$$\n\n   dengan $s_y$ dan $s_{\\hat{y}}$ masing-masing adalah simpangan baku observasi dan simpangan baku prediksi. Apabila prediksi model mengalami penyempitan varians yang parah ($s_{\\hat{y}} \\ll s_y$), nilai $\\text{CCC}$ akan turun secara nyata meskipun korelasi linier $r$ cukup baik.\n\n### 3. Evaluasi Empiris Kinerja Model dan Pengaruh SMOGN di Sub-DAS Bompon\n\nRingkasan lengkap hasil validasi silang LOOCV dari keempat algoritma (RF, QRF, CatBoost, dan *Stacking Ensemble*) pada skenario tanpa SMOGN dan dengan SMOGN di Sub-DAS Bompon disajikan pada Tabel 8.2 dan divisualisasikan pada Gambar 8.4.\n\nTabel 8.2 Perbandingan kinerja validasi silang (LOOCV, $N = 50$) empat algoritma pembelajaran mesin tanpa SMOGN dan dengan SMOGN untuk prediksi fraksi tekstur tanah pada Lapisan 1 ($0\\text{--}20\\text{ cm}$) dan Lapisan 2 ($20\\text{--}40\\text{ cm}$) di Sub-DAS Bompon\n| Fraksi \u0026 Kedalaman | Skenario Data | RF ($R^2$ / RMSE / MAE) | QRF ($R^2$ / RMSE / MAE) | CatBoost ($R^2$ / RMSE / MAE) | Stacking ($R^2$ / RMSE / MAE) |\n| :--- | :--- | :---: | :---: | :---: | :---: |\n| **Pasir Lapisan 1** ($0\\text{--}20\\text{ cm}$) | Tanpa SMOGN | $-0,030$ / $6,846$ / $4,990$ | $-0,080$ / $6,624$ / $4,629$ | $0,040$ / $6,590$ / $4,758$ | $0,081$ / $6,460$ / $4,963$ |\n| **Pasir Lapisan 1** ($0\\text{--}20\\text{ cm}$) | **Dengan SMOGN** | $0,030$ / $6,829$ / $5,046$ | $-0,060$ / $6,944$ / $5,186$ | $0,110$ / $6,365$ / $4,461$ | **$0,249$ / $5,840$ / $4,660$** |\n| **Pasir Lapisan 2** ($20\\text{--}40\\text{ cm}$) | Tanpa SMOGN | $-0,040$ / $7,374$ / $5,965$ | $-0,110$ / $7,699$ / $6,029$ | $0,010$ / $7,252$ / $5,949$ | $0,082$ / $6,940$ / $5,736$ |\n| **Pasir Lapisan 2** ($20\\text{--}40\\text{ cm}$) | **Dengan SMOGN** | $0,010$ / $7,232$ / $5,928$ | $-0,010$ / $7,278$ / $5,911$ | $-0,110$ / $7,633$ / $6,255$ | **$0,124$ / $6,780$ / $5,330$** |\n| **Debu Lapisan 1** ($0\\text{--}20\\text{ cm}$) | Tanpa SMOGN | $-0,080$ / $6,755$ / $5,184$ | $-0,310$ / $7,448$ / $5,795$ | $0,150$ / $6,956$ / $5,202$ | $0,159$ / $5,954$ / $4,570$ |\n| **Debu Lapisan 1** ($0\\text{--}20\\text{ cm}$) | **Dengan SMOGN** | $0,040$ / $6,630$ / $5,245$ | $-0,320$ / $7,473$ / $5,865$ | $-0,040$ / $6,618$ / $5,017$ | **$0,196$ / $5,820$ / $4,630$** |\n| **Debu Lapisan 2** ($20\\text{--}40\\text{ cm}$) | Tanpa SMOGN | $0,080$ / $5,847$ / $4,493$ | $-0,120$ / $6,425$ / $4,701$ | $0,080$ / $5,847$ / $4,309$ | $0,125$ / $5,690$ / $4,548$ |\n| **Debu Lapisan 2** ($20\\text{--}40\\text{ cm}$) | **Dengan SMOGN** | $0,080$ / $5,834$ / $4,478$ | $-0,140$ / $6,496$ / $4,941$ | $0,030$ / $5,874$ / $4,408$ | **$0,137$ / $5,810$ / $4,590$** |\n| **Lempung Lapisan 1** ($0\\text{--}20\\text{ cm}$) | Tanpa SMOGN | $0,030$ / $9,856$ / $7,746$ | $-0,050$ / $9,968$ / $7,608$ | $-0,060$ / $10,020$ / $7,742$ | $0,098$ / $9,238$ / $7,246$ |\n| **Lempung Lapisan 1** ($0\\text{--}20\\text{ cm}$) | **Dengan SMOGN** | $0,010$ / $9,672$ / $7,627$ | $-0,020$ / $9,809$ / $7,337$ | $0,040$ / $9,546$ / $7,344$ | **$0,099$ / $9,230$ / $7,130$** |\n| **Lempung Lapisan 2** ($20\\text{--}40\\text{ cm}$) | Tanpa SMOGN | $0,050$ / $9,970$ / $8,249$ | $-0,060$ / $10,524$ / $8,608$ | $0,050$ / $9,972$ / $8,413$ | **$0,184$ / $9,224$ / $7,590$** |\n| **Lempung Lapisan 2** ($20\\text{--}40\\text{ cm}$) | Dengan SMOGN | $-0,030$ / $10,356$ / $8,434$ | $-0,090$ / $10,649$ / $8,942$ | $0,020$ / $10,106$ / $8,348$ | $0,093$ / $9,730$ / $7,920$ |\nSumber: Diolah dari Tabel 4.4 dan Tabel 4.5 Fatmawati (2026); satuan RMSE dan MAE dalam persen fraksi tekstur ($\\%$)\n\n![](assets/modul-8/M8-G04_perbandingan-akurasi-model-bompon.png)\nGambar 8.4 Perbandingan metrik evaluasi validasi silang antar-algoritma di Sub-DAS Bompon: (a) koefisien determinasi ($R^2$) dan (b) galat akar rata-rata kuadrat ($\\text{RMSE}$, $\\%$) pada enam kombinasi fraksi tekstur dan lapisan kedalaman\nSumber: Diolah dari data hasil pemodelan Fatmawati (2026)\n\nAnalisis mendalam terhadap angka empiris pada Tabel 8.2 dan Gambar 8.4 mengungkap empat pelajaran metodologis yang sangat berharga bagi praktisi DSM:\n\n1. **Keunggulan Konsisten *Stacking Ensemble* di Atas Algoritma Tunggal**: Pada seluruh enam variabel target (baik pada skenario tanpa SMOGN maupun dengan SMOGN), model *Stacking Ensemble* selalu mencapai nilai $R^2$ tertinggi dan $\\text{RMSE}$ terendah dibandingkan RF, QRF, maupun CatBoost secara individual. Ketika algoritma tunggal seperti RF dan QRF menghasilkan $R^2$ negatif pada Pasir Lapisan 1 tanpa SMOGN ($R^2_{\\text{RF}} = -0,030$; $R^2_{\\text{QRF}} = -0,080$), penggabungan ketiganya melalui *meta-learner* Stacking mampu mengekstraksi sinyal komplementer sehingga menghasilkan $R^2$ positif ($0,081$ tanpa SMOGN dan melonjak menjadi $0,249$ dengan SMOGN).\n2. **Efektivitas SMOGN Berbanding Lurus dengan Tingkat Kemiringan/Variabilitas Target ($\\text{CV}$)**: Penerapan *resampling* SMOGN meningkatkan kinerja model *Stacking* secara tajam pada **Pasir Lapisan 1** ($R^2$ meningkat tiga kali lipat dari $0,081$ menjadi $0,249$; $\\text{RMSE}$ turun dari $6,460\\%$ menjadi $5,840\\%$), **Pasir Lapisan 2** ($R^2$ naik dari $0,082$ menjadi $0,124$; $\\text{RMSE}$ turun dari $6,940\\%$ menjadi $6,780\\%$), **Debu Lapisan 1** ($R^2$ naik dari $0,159$ menjadi $0,196$; $\\text{RMSE}$ turun dari $5,954\\%$ menjadi $5,820\\%$), serta **Debu Lapisan 2** ($R^2$ naik dari $0,125$ menjadi $0,137$). Hal ini selaras dengan statistik deskriptif observasi laboratorium: fraksi pasir memiliki Koefisien Variasi ($\\text{CV}$) tertinggi yakni $41,42\\%$ (Lapisan 1) dan $46,68\\%$ (Lapisan 2), disusul fraksi debu dengan $\\text{CV}$ sebesar $31,10\\%$ dan $31,44\\%$. Pada variabel dengan $\\text{CV}$ tinggi dan ekor distribusi yang timpang, penambahan sampel sintetis oleh SMOGN membantu pohon keputusan mengenali karakteristik lereng dan indeks spektral pada lokasi-lokasi berpasir/berdebu tinggi.\n3. **Keterbatasan SMOGN pada Variabel yang Sudah Homogen (Lempung Lapisan 2)**: Sebaliknya, pada fraksi lempung yang secara alami sudah sangat dominan dan memiliki variasi relatif paling rendah ($\\text{CV} = 15,72\\%$ pada Lapisan 1 dan $15,93\\%$ pada Lapisan 2), penambahan SMOGN pada Lempung Lapisan 1 hanya memberikan peningkatan marginal ($R^2$ dari $0,098$ menjadi $0,099$), dan pada **Lempung Lapisan 2 justru menurunkan $R^2$ *Stacking*** dari $0,184$ ($\\text{RMSE} = 9,224\\%$) menjadi $0,093$ ($\\text{RMSE} = 9,730\\%$). Fenomena ini terjadi karena pada horison bawah ($20\\text{--}40\\text{ cm}$) yang terlindung dari erosi permukaan langsung, kadar lempung telah terdistribusi cukup merata di kisaran $55\\text{--}75\\%$; memaksakan *under-sampling* pada zona utama dan menyuntikkan titik sintetis berderau Gauss pada kondisi tersebut justru mengaburkan batas pemisahan fungsi kovariat topografi (Fatmawati, 2026).\n4. **Mengapa Nilai $R^2$ DSM Tekstur Tanah di Lanskap Tropis Kompleks Berkisar $0,10\\text{--}0,25$?**: Dalam literatur DSM global maupun tropis (Minasny dan McBratney, 2016; Wadoux et al., 2021), nilai $R^2$ validasi silang untuk sifat fisik tanah di daerah berbukit dengan tutupan vegetasi rapat sering kali berada pada rentang $0,10$ hingga $0,35$. Di Sub-DAS Bompon, terdapat tiga penyebab fisik utama mengapa varians yang terjelaskan oleh kovariat jarak jauh tidak melampaui $25\\%$: (a) kanopi kebun campuran/agroforestri yang rapat menghalangi sensor pasif Sentinel-2A mengindera permukaan tanah secara langsung (*canopy masking*), (b) rentang variasi kadar lempung yang sempit di seluruh sub-DAS karena tingkat pelapukan lanjut yang seragam pada breksi vulkanik, serta (c) adanya variasi mikro-topografi dan riwayat pengolahan lahan petani (pembuatan teras bangku, pencangkulan lokal, dan longsoran tebing mikro) pada skala $\u003c 5\\text{ m}$ yang tidak tertangkap oleh resolusi kovariat maupun jumlah sampel $N = 50$.\n\n### 4. Interpretasi Tingkat Kepentingan Kovariat (Variable Importance) dan Mekanisme Pedogenetik\n\nHasil pemeringkatan tingkat kepentingan kovariat (*variable importance*) yang terpilih melalui RFE pada keenam variabel target ditunjukkan pada Gambar 8.5. Secara keseluruhan, **kovariat kelompok Relief ($R$) mendominasi lebih dari $80\\%$ kontribusi penjelas** pada seluruh fraksi tekstur dan lapisan kedalaman, diikuti oleh kelompok Organisme ($O$), Tanah ($S$), dan Posisi Relatif Ruang ($N$).\n\n![](assets/modul-8/M8-G05_tingkat-kepentingan-kovariat-rfe-bompon.png)\nGambar 8.5 Tingkat kepentingan relatif kovariat lingkungan (*variable importance*, $\\%$) hasil seleksi *Recursive Feature Elimination* (RFE) untuk prediksi fraksi pasir, debu, dan lempung pada Lapisan 1 ($0\\text{--}20\\text{ cm}$) dan Lapisan 2 ($20\\text{--}40\\text{ cm}$) di Sub-DAS Bompon\nSumber: Diolah dari Gambar 4.4, 4.5, dan 4.6 Fatmawati (2026)\n\nKeterkaitan mekanistik antara kovariat terpenting pada Gambar 8.5 dengan proses geomorfologi dan pedogenesis di Sub-DAS Bompon dapat diuraikan secara rinci per fraksi tekstur:\n\n1. **Pengendali Spasial Fraksi Pasir (Lapisan 1 dan Lapisan 2)**:\n   - Pada Lapisan 1 ($0\\text{--}20\\text{ cm}$), lima prediktor terpilih RFE secara berurutan adalah *Aspect* ($21,92\\%$), *Profile curvature* ($21,29\\%$), $\\text{TWI}$ ($20,70\\%$), *Clay Index* ($19,13\\%$), dan *Valley depth* ($16,96\\%$). Arah hadap lereng (*Aspect*) mengendalikan intensitas penyinaran matahari dan amplitudo pemanasan harian permukaan tanah yang memicu desintegrasi fisik agregat dan mineral tuf pasiran. *Profile curvature* mengatur percepatan aliran limpasan permukaan: pada lereng atas/tengah yang cembung, percepatan limpasan mengikis dan mengangkut partikel halus (lempung dan debu) menuruni lereng (*selective erosion*), sehingga menyisakan residu fraksi kasar (pasir) di tempat (*lag deposit*). Kehadiran *Clay Index* ($\\text{SWIR}_1/\\text{SWIR}_2$) sebesar $19,13\\%$ menunjukkan korelasi terbalik yang kuat: piksel dengan serapan mineral lempung hidroksil yang lemah pada spektrum $\\text{SWIR}$ berasosiasi dengan singkapan tanah berpasir lebih tinggi.\n   - Pada Lapisan 2 ($20\\text{--}40\\text{ cm}$), sepuluh prediktor terpilih dipimpin oleh *Elevasi* ($12,65\\%$), $\\text{CNBL}$ ($12,50\\%$), $\\text{TWI}$ ($11,84\\%$), *Slope* ($9,62\\%$), dan $\\text{NDVI}$ ($9,44\\%$). Dominasi elevasi dan $\\text{CNBL}$ pada lapisan bawah mencerminkan kontrol posisi ketinggian satuan litologi tuf pasiran dan breksi vulkanik terhadap distribusi butir kasar yang belum terlapuk sempurna di horison bawah permukaan.\n2. **Pengendali Spasial Fraksi Debu (Lapisan 1 dan Lapisan 2)**:\n   - Pada Lapisan 1 ($0\\text{--}20\\text{ cm}$), sepuluh prediktor terpilih dipimpin oleh *Valley depth* ($15,34\\%$), $\\text{TPI}$ ($14,03\\%$), *Slope* ($12,11\\%$), $\\text{MrVBF}$ ($11,51\\%$), $\\text{MrRTF}$ ($10,07\\%$), serta *Jarak dari sungai* ($8,55\\%$). Fraksi debu ($2\\text{--}50\\text{ }\\mu\\text{m}$) merupakan ukuran partikel yang paling mudah terlepas oleh pukulan air hujan dan paling aktif ditransportasikan oleh erosi lembar (*sheet erosion*) dari punggung dan lereng curam ($\\text{TPI}$ positif, *Slope* tinggi) menuju zona akumulasi di kaki lereng, cekungan lembah (*Valley depth* besar, $\\text{MrVBF}$ tinggi), dan dataran banjir di dekat alur sungai (*Jarak dari sungai* dekat).\n   - Pada Lapisan 2 ($20\\text{--}40\\text{ cm}$), lima prediktor terpilih seluruhnya berasal dari faktor Relief ($R$), yakni *Elevasi* ($23,90\\%$), $\\text{MrRTF}$ ($23,06\\%$), *Plan curvature* ($19,28\\%$), $\\text{MrVBF}$ ($16,98\\%$), dan *Aspect* ($15,78\\%$). Kombinasi $\\text{MrRTF}$ dan $\\text{MrVBF}$ dengan *Plan curvature* menunjukkan bahwa akumulasi debu di lapisan bawah dikendalikan oleh konvergensi aliran lateral dan riwayat pengendapan koluvial jangka panjang pada cekungan lembah dan punggungan datar.\n3. **Pengendali Spasial Fraksi Lempung (Lapisan 1 dan Lapisan 2)**:\n   - Pada Lapisan 1 ($0\\text{--}20\\text{ cm}$), kelima prediktor terpilih murni merupakan variabel morfometri lereng: *Profile curvature* ($23,32\\%$), *Plan curvature* ($19,45\\%$), *Curvature* ($19,25\\%$), *Slope* ($19,19\\%$), dan $\\text{MrVBF}$ ($18,80\\%$). Ketiga parameter kelengkungan lereng menyumbang total $62,02\\%$ tingkat kepentingan! Hal ini menegaskan bahwa pada tanah permukaan Sub-DAS Bompon, variasi kadar lempung dikendalikan secara langsung oleh keseimbangan hidrodinamika lereng: zona puncak datar dan cekungan konvergen yang berlereng landai mempertahankan horison lempung hasil pelapukan lanjut atau menerima endapan suspensi halus, sedangkan zona tekuk lereng cembung-curam mengalami pengupasan lapisan lempung atas.\n   - Pada Lapisan 2 ($20\\text{--}40\\text{ cm}$), sepuluh prediktor terpilih dipimpin oleh *Plan curvature* ($11,74\\%$), *Elevasi* ($10,90\\%$), $\\text{MrRTF}$ ($10,68\\%$), *Slope* ($10,51\\%$), dan $\\text{TPI}$ ($10,26\\%$), serta melibatkan dua indeks spektral vegetasi/kebasahan yakni $\\text{NDWI}$ ($9,80\\%$) dan $\\text{NDVI}$ ($9,69\\%$). Munculnya $\\text{NDWI}$ dan $\\text{NDVI}$ pada prediksi lempung lapisan bawah ($20\\text{--}40\\text{ cm}$) memiliki penjelasan biofisik yang sangat logis: pada kedalaman zona perakaran aktif ($20\\text{--}40\\text{ cm}$), tanah yang berlempung tebal dan berstruktur mantap memiliki kapasitas menahan air tersedia yang lebih tinggi pada musim kemarau, sehingga menopang kanopi vegetasi tahunan yang lebih rapat ($\\text{NDVI}$ tinggi) dan kandungan air tajuk yang lebih segar ($\\text{NDWI}$ tinggi) (Fatmawati, 2026).\n\n---\n\n## Residual dan Uncertainty\n\nPeta prediksi sifat tanah yang dihasilkan oleh algoritma pembelajaran mesin tidak pernah bebas dari kesalahan. Menyajikan peta prediksi titik (*point prediction map*) tanpa menyertakan informasi mengenai sebaran residual dan ketidakpastian spasial (*spatial uncertainty*) dapat menyesatkan pengambil keputusan, karena pengguna peta tidak dapat membedakan wilayah yang diprediksi dengan keyakinan tinggi dari wilayah yang prediksinya sangat spekulatif (Heuvelink, 2014; Brus et al., 2011).\n\n### 1. Dekomposisi Galat Residual dan Variogram Residual\n\nUntuk setiap titik pengamatan ke-$i$ pada koordinat $\\mathbf{s}_i = (x_i, y_i)$, residual validasi silang didefinisikan sebagai selisih antara nilai laboratorium sejati $y(\\mathbf{s}_i)$ dan nilai prediksi model $\\hat{y}(\\mathbf{s}_i)$:\n\n$$e(\\mathbf{s}_i) = y(\\mathbf{s}_i) - \\hat{y}(\\mathbf{s}_i)$$\n\nTanda dan besaran residual membawa makna diagnostik yang penting:\n- **Residual positif ($e(\\mathbf{s}_i) \u003e 0$, $y_i \u003e \\hat{y}_i$)**: Model mengalami **under-prediction** (menaksir terlalu rendah). Sebagai contoh, titik sampel yang berada pada singkapan lokal lensa tuf pasiran memiliki kadar pasir aktual $32\\%$, tetapi model memprediksi $19\\%$ karena topografi di sekitarnya menyerupai lereng breksi berlempung.\n- **Residual negatif ($e(\\mathbf{s}_i) \u003c 0$, $y_i \u003c \\hat{y}_i$)**: Model mengalami **over-prediction** (menaksir terlalu tinggi). Sebagai contoh, titik sampel pada punggungan datar yang baru saja terganggu oleh penggalian tebing jalan memiliki kadar lempung aktual $42\\%$, padahal model memprediksi $64\\%$.\n\nSecara geostatistik, residual $e(\\mathbf{s})$ dapat dipandang sebagai jumlah dari komponen sinyal spasial lokal yang belum tertangkap oleh kovariat $\\text{SCORPAN}$, yakni $\\eta(\\mathbf{s})$, dan galat acak murni (*white noise* / *nugget effect* akibat galat pengukuran laboratorium serta variasi mikro sub-piksel), yakni $\\varepsilon(\\mathbf{s})$:\n\n$$e(\\mathbf{s}) = \\eta(\\mathbf{s}) + \\varepsilon(\\mathbf{s})$$\n\nUntuk menguji apakah masih terdapat autokorelasi spasial pada residual $e(\\mathbf{s}_i)$, dihitung semivariogram eksperimental residual $\\hat{\\gamma}_e(h)$ sebagai fungsi jarak pisah (*lag distance*) $h$:\n\n$$\\hat{\\gamma}_e(h) = \\frac{1}{2 \\, |N(h)|} \\sum_{(i, j) \\in N(h)} \\left[ e(\\mathbf{s}_i) - e(\\mathbf{s}_j) \\right]^2$$\n\ndengan $N(h)$ adalah himpunan pasangan titik sampel yang terpisah sejauh $h \\pm \\Delta h$. Apabila semivariogram residual $\\hat{\\gamma}_e(h)$ menunjukkan struktur spasial yang jelas (rasio *nugget-to-sill* $C_0 / (C_0 + C_1)$ rendah dan terdapat jarak jangkauan korelasi *range* $a$ yang nyata), maka prediksi model pembelajaran mesin dapat dipertajam melalui teknik hibrida **Regression-Kriging** (atau *Random Forest Kriging* / RFK), yakni menjumlahkan permukaan tren regresi $\\hat{y}_{\\text{ML}}(\\mathbf{s}_0)$ dengan hasil interpolasi *Ordinary Kriging* atas residual $\\hat{e}_{\\text{OK}}(\\mathbf{s}_0)$ (Hengl et al., 2004; Keskin dan Grunwald, 2018):\n\n$$\\hat{y}_{\\text{RFK}}(\\mathbf{s}_0) = \\hat{y}_{\\text{ML}}(\\mathbf{s}_0) + \\sum_{i=1}^{N} \\lambda_i \\, e(\\mathbf{s}_i)$$\n\nNamun, apabila jarak antar-titik sampel di lapangan lebih besar daripada jarak korelasi alami sifat tanah sehingga semivariogram residual berbentuk datar murni (*pure nugget effect*, $C_0 / (C_0 + C_1) \\approx 1$), maka *kriging* residual tidak akan menambah akurasi prediksi dan kuantifikasi ketidakpastian harus bertumpu pada distribusi prediksi ensambel atau kuantil QRF.\n\n### 2. Gejala Penghalusan Ekor Distribusi (Smoothing of Distribution Tails)\n\nSalah satu karakteristik struktural dari seluruh algoritma regresi yang meminimumkan fungsi kerugian kuadrat (*least-squares loss*) maupun perata-rataan pohon keputusan adalah terjadinya **penghalusan ekor distribusi (*smoothing of distribution tails* atau *variance compression*)**. Karena prediksi pada setiap piksel merupakan ekspektasi bersyarat $\\hat{y}(\\mathbf{x}) = E(Y \\mid \\mathbf{X} = \\mathbf{x})$, hukum varians total menyatakan bahwa varians dari nilai harapan bersyarat selalu lebih kecil daripada varians total variabel aslinya:\n\n$$\\text{Var}(Y) = \\text{Var}\\!\\left(E(Y \\mid \\mathbf{X})\\right) + E\\!\\left(\\text{Var}(Y \\mid \\mathbf{X})\\right) \\implies \\text{Var}(\\hat{Y}) \u003c \\text{Var}(Y)$$\n\nBukti empiris dari gejala penyempitan varians ini terlihat sangat jelas apabila kita membandingkan statistik deskriptif data observasi laboratorium ($N = 50$) dengan statistik piksel peta prediksi *Stacking Ensemble* di Sub-DAS Bompon sebagaimana tercantum pada Tabel 8.3.\n\nTabel 8.3 Perbandingan statistik deskriptif tekstur tanah hasil observasi laboratorium ($N = 50$) dengan hasil prediksi spasial *Stacking Ensemble* (+ SMOGN) di Sub-DAS Bompon\n| Variabel \u0026 Kedalaman | Sumber Statistik | Minimum ($\\%$) | Maksimum ($\\%$) | Rata-rata / Mean ($\\%$) | Simpangan Baku / STD ($\\%$) | Koefisien Variasi / CV ($\\%$) |\n| :--- | :--- | :---: | :---: | :---: | :---: | :---: |\n| **Pasir Lapisan 1** ($0\\text{--}20\\text{ cm}$) | Observasi Lab ($N=50$) | $6,49$ | $33,67$ | $16,43$ | $6,81$ | $41,42$ |\n| **Pasir Lapisan 1** ($0\\text{--}20\\text{ cm}$) | Peta Prediksi *Stacking* | $7,05$ | $33,67$ | $16,50$ | $2,84$ | $17,21$ |\n| **Pasir Lapisan 2** ($20\\text{--}40\\text{ cm}$) | Observasi Lab ($N=50$) | $5,94$ | $32,50$ | $15,68$ | $7,32$ | $46,68$ |\n| **Pasir Lapisan 2** ($20\\text{--}40\\text{ cm}$) | Peta Prediksi *Stacking* | $7,15$ | $30,03$ | $15,20$ | $2,46$ | $16,18$ |\n| **Debu Lapisan 1** ($0\\text{--}20\\text{ cm}$) | Observasi Lab ($N=50$) | $10,77$ | $41,80$ | $21,09$ | $6,56$ | $31,10$ |\n| **Debu Lapisan 1** ($0\\text{--}20\\text{ cm}$) | Peta Prediksi *Stacking* | $12,23$ | $40,39$ | $20,85$ | $2,86$ | $13,73$ |\n| **Debu Lapisan 2** ($20\\text{--}40\\text{ cm}$) | Observasi Lab ($N=50$) | $10,02$ | $37,81$ | $19,54$ | $6,14$ | $31,44$ |\n| **Debu Lapisan 2** ($20\\text{--}40\\text{ cm}$) | Peta Prediksi *Stacking* | $10,09$ | $36,52$ | $19,23$ | $2,64$ | $13,73$ |\n| **Lempung Lapisan 1** ($0\\text{--}20\\text{ cm}$) | Observasi Lab ($N=50$) | $38,97$ | $82,73$ | $62,48$ | $9,82$ | $15,72$ |\n| **Lempung Lapisan 1** ($0\\text{--}20\\text{ cm}$) | Peta Prediksi *Stacking* | $39,40$ | $80,92$ | $62,29$ | $4,89$ | $7,85$ |\n| **Lempung Lapisan 2** ($20\\text{--}40\\text{ cm}$) | Observasi Lab ($N=50$) | $44,49$ | $82,24$ | $64,78$ | $10,32$ | $15,93$ |\n| **Lempung Lapisan 2** ($20\\text{--}40\\text{ cm}$) | Peta Prediksi *Stacking* | $44,82$ | $81,74$ | $65,54$ | $4,15$ | $6,33$ |\nSumber: Diolah dari Tabel 4.2 dan Tabel 4.3 Fatmawati (2026)\n\nSebagaimana terlihat pada Tabel 8.3, model *Stacking Ensemble* dengan bantuan SMOGN mampu mempertahankan nilai **rata-rata (*mean*)** serta **batas minimum dan maksimum** peta prediksi agar sangat dekat dengan statistik observasi laboratorium (misalnya pada Lempung Lapisan 1, rata-rata prediksi $62,29\\%$ berbanding observasi $62,48\\%$, dan rentang prediksi $39,40\\text{--}80,92\\%$ berbanding observasi $38,97\\text{--}82,73\\%$). Namun, **simpangan baku ($\\text{STD}$) dan Koefisien Variasi ($\\text{CV}$) peta prediksi menyusut sekitar $50\\text{--}65\\%$ dibandingkan data observasi**: pada Pasir Lapisan 1, $\\text{STD}$ turun dari $6,81\\%$ menjadi $2,84\\%$ ($\\text{CV}$ turun dari $41,42\\%$ menjadi $17,21\\%$); pada Debu Lapisan 1, $\\text{STD}$ turun dari $6,56\\%$ menjadi $2,86\\%$; dan pada Lempung Lapisan 1, $\\text{STD}$ turun dari $9,82\\%$ menjadi $4,89\\%$. Penyusutan simpangan baku ini menunjukkan bahwa meskipun titik-titik ekstrem pada ekor distribusi berhasil direproduksi pada piksel-piksel lokal yang memiliki kombinasi topografi ekstrem, sebagian besar piksel di bentang lahan diprediksi mengelompok lebih rapat di sekitar nilai tengah (Fatmawati, 2026).\n\n### 3. Kuantifikasi Ketidakpastian Spasial (PI90, PIR90, dan PICP)\n\nUntuk menyajikan tingkat keyakinan prediksi secara spasial di setiap piksel $\\mathbf{x}_0$, standar pemetaan tanah digital global (*GlobalSoilMap*) menetapkan penggunaan **Interval Prediksi 90% (*90% Prediction Interval*, $\\text{PI}_{90}$)** yang dibatasi oleh kuantil ke-$5\\%$ ($\\hat{q}_{0,05}$, batas bawah / *lower limit*) dan kuantil ke-$95\\%$ ($\\hat{q}_{0,95}$, batas atas / *upper limit*) dari distribusi prediksi QRF atau *bootstrapping* ansambel (Arrouays et al., 2014; Vaysse dan Lagacherie, 2017):\n\n$$\\text{PI}_{90}(\\mathbf{x}_0) = \\left[ \\hat{q}_{0,05}(\\mathbf{x}_0), \\; \\hat{q}_{0,95}(\\mathbf{x}_0) \\right]$$\n\nLebar rentang ketidakpastian pada piksel $\\mathbf{x}_0$ dinyatakan sebagai **Prediction Interval Range ($\\text{PIR}_{90}$)** atau *Prediction Interval Width*:\n\n$$\\text{PIR}_{90}(\\mathbf{x}_0) = \\hat{q}_{0,95}(\\mathbf{x}_0) - \\hat{q}_{0,05}(\\mathbf{x}_0)$$\n\nSemakin kecil nilai $\\text{PIR}_{90}(\\mathbf{x}_0)$, semakin sempit selang ketidakpastian dan semakin tinggi tingkat kepastian prediksi pada piksel tersebut; sebaliknya, nilai $\\text{PIR}_{90}(\\mathbf{x}_0)$ yang lebar menandakan bahwa pohon-pohon keputusan di dalam ansambel memberikan prediksi yang sangat beragam untuk kombinasi kovariat pada piksel tersebut. Untuk memvalidasi apakah selang $\\text{PI}_{90}$ yang dihasilkan oleh model bersifat jujur secara probabilistik, dihitung metrik **Prediction Interval Coverage Probability ($\\text{PICP}_{90}$)** pada seluruh $N$ titik validasi silang:\n\n$$\\text{PICP}_{90} = \\frac{1}{N} \\sum_{i=1}^{N} \\mathbb{I}\\!\\left\\{ \\hat{q}_{0,05}^{(-i)}(\\mathbf{x}_i) \\le y_i \\le \\hat{q}_{0,95}^{(-i)}(\\mathbf{x}_i) \\right\\} \\times 100\\%$$\n\nApabila model ketidakpastian terkalibrasi dengan baik (*well-calibrated*), nilai $\\text{PICP}_{90}$ harus mendekati peluang nominalnya yakni **$90\\%$** (sekitar $45$ dari $50$ titik sampel lapangan jatuh di dalam selang $[\\hat{q}_{0,05}, \\hat{q}_{0,95}]$). Apabila $\\text{PICP}_{90} \\ll 90\\%$ (misalnya hanya $65\\%$), maka selang ketidakpastian yang dihasilkan terlalu sempit (*overconfident*); sebaliknya jika $\\text{PICP}_{90} \\approx 100\\%$, selang prediksi terlalu lebar (*underconfident* / terlalu konservatif) (Schmidinger dan Heuvelink, 2023).\n\n### 4. Kendala Komposisional Tekstur Tanah (Constant-Sum Constraint 100%)\n\nAspek krusial yang wajib diperhatikan ketika memetakan fraksi pasir, debu, dan lempung secara terpisah menggunakan tiga model pembelajaran mesin independen adalah sifat **data komposisional tertutup (*closed compositional data*)** yang harus memenuhi kendala non-negatif dan jumlah konstan $100\\%$ pada setiap piksel $\\mathbf{x}_0$ (Aitchison, 1986; Odeh et al., 2003):\n\n$$\\hat{y}_{\\text{pasir}}(\\mathbf{x}_0) \\ge 0, \\quad \\hat{y}_{\\text{debu}}(\\mathbf{x}_0) \\ge 0, \\quad \\hat{y}_{\\text{lempung}}(\\mathbf{x}_0) \\ge 0, \\qquad \\hat{y}_{\\text{pasir}}(\\mathbf{x}_0) + \\hat{y}_{\\text{debu}}(\\mathbf{x}_0) + \\hat{y}_{\\text{lempung}}(\\mathbf{x}_0) = 100\\%$$\n\nKarena model Pasir, Debu, dan Lempung dilatih secara terpisah dengan subset fitur RFE yang berbeda, penjumlahan mentah ketiga raster prediksi hampir pasti menyimpang dari $100\\%$ pada banyak piksel (misalnya berjumlah $96,4\\%$ atau $103,8\\%$). Terdapat dua pendekatan baku untuk menjamin konsistensi komposisional $100\\%$:\n1. **Normalisasi penutupan pasca-prediksi (*post-hoc closure normalization*)**: Setiap nilai prediksi mentah $\\tilde{y}_c(\\mathbf{x}_0)$ ($c \\in \\{\\text{pasir}, \\text{debu}, \\text{lempung}\\}$) dibagi dengan jumlah ketiga fraksi pada piksel tersebut lalu dikalikan $100$:\n\n$$\\hat{y}_c(\\mathbf{x}_0) = \\frac{\\tilde{y}_c(\\mathbf{x}_0)}{\\tilde{y}_{\\text{pasir}}(\\mathbf{x}_0) + \\tilde{y}_{\\text{debu}}(\\mathbf{x}_0) + \\tilde{y}_{\\text{lempung}}(\\mathbf{x}_0)} \\times 100\\%$$\n\n2. **Transformasi *Additive Log-Ratio* ($\\text{ALR}$) atau * Isometric Log-Ratio* ($\\text{ILR}$) pra-pemodelan**: Tiga fraksi komposisional ditransformasikan menjadi dua variabel bebas tanpa kendala di ruang bilangan riil $\\mathbb{R}^2$, misalnya $z_1 = \\ln(y_{\\text{pasir}} / y_{\\text{lempung}})$ dan $z_2 = \\ln(y_{\\text{debu}} / y_{\\text{lempung}})$. Setelah $z_1(\\mathbf{x}_0)$ dan $z_2(\\mathbf{x}_0)$ diprediksi oleh model, keduanya ditransformasi balik menggunakan fungsi *softmax* logistik:\n\n$$\\hat{y}_{\\text{pasir}} = \\frac{e^{\\hat{z}_1}}{1 + e^{\\hat{z}_1} + e^{\\hat{z}_2}} \\times 100\\%, \\quad \\hat{y}_{\\text{debu}} = \\frac{e^{\\hat{z}_2}}{1 + e^{\\hat{z}_1} + e^{\\hat{z}_2}} \\times 100\\%, \\quad \\hat{y}_{\\text{lempung}} = \\frac{1}{1 + e^{\\hat{z}_1} + e^{\\hat{z}_2}} \\times 100\\%$$\n\nHasil pemetaan spasial ketiga fraksi tekstur Lapisan 1 ($0\\text{--}20\\text{ cm}$) yang telah memenuhi kendala penutupan $100\\%$ beserta peta ketidakpastian $\\text{PIR}_{90}$ fraksi lempung di Sub-DAS Bompon disajikan pada Gambar 8.6.\n\n![](assets/modul-8/M8-G06_peta-prediksi-dan-ketidakpastian-tekstur-bompon.png)\nGambar 8.6 Peta hasil prediksi spasial tekstur tanah Lapisan 1 ($0\\text{--}20\\text{ cm}$) menggunakan *Stacking Ensemble* dan kuantifikasi ketidakpastian di Sub-DAS Bompon: (a) fraksi pasir ($\\%$), (b) fraksi debu ($\\%$), (c) fraksi lempung ($\\%$), dan (d) lebar interval prediksi $90\\%$ ($\\text{PIR}_{90}$, $\\%$) fraksi lempung beserta sebaran 50 titik sampel lapangan\nSumber: Diolah dari tumpukan kovariat Sub-DAS Bompon mengacu pada parameter model Fatmawati (2026)\n\nPola spasial pada Gambar 8.6 memperlihatkan diferensiasi lanskap pedo-geomorfik yang sangat koheren di Sub-DAS Bompon:\n- **Zona Punggungan, Puncak Bukit, dan Dataran Vulkanik Stabil** (warna merah tua pada panel c, dengan kadar lempung $65\\text{--}72\\%$): Pelapukan *in-situ* yang telah berlangsung lama pada breksi vulkanik tanpa pengikisan ekstrem menghasilkan solum tanah berlempung sangat berat (kaolinitik).\n- **Zona Tekuk Lereng Curam dan Singkapan Tuf Pasiran** (warna cokelat tua pada panel a, dengan kadar pasir $20\\text{--}26\\%$ dan lempung turun ke $48\\text{--}55\\%$): Kemiringan lereng yang curam dan kelengkungan profil cembung mempercepat limpasan permukaan yang mengangkut partikel halus, menyisakan residu pasir di lereng atas/tengah.\n- **Zona Kaki Lereng Koluvial dan Cekungan Lembah Sungai Bompon** (warna biru tua pada panel b, dengan kadar debu $24\\text{--}30\\%$): Perlambatan kecepatan aliran pada cekungan konvergen ($\\text{TWI}$ dan $\\text{MrVBF}$ tinggi, *Valley depth* dalam) menyebabkan pengendapan selektif partikel ukuran debu yang tercuci dari lereng perbukitan di atasnya.\n- **Zona Ketidakpastian Tinggi pada Peta $\\text{PIR}_{90}$** (warna ungu-merah tua pada panel d, dengan $\\text{PIR}_{90} \u003e 26\\%$): Ketidakpastian prediksi tertinggi terkonsentrasi pada lereng tebing sangat curam, batas transisi tajam antar-bentuklahan, serta area tepi batas luar sub-DAS yang memiliki kerapatan titik sampel lapangan lebih jarang (*undersampled covariate space*). Peta $\\text{PIR}_{90}$ ini menjadi panduan langsung apabila akan dilakukan survei suplemen tahap kedua (*adaptive infill sampling*).\n\n---\n\n*Demonstrasi dan praktik:*\n\n## Praktik: Pemodelan Spasial Tekstur Tanah dan Kuantifikasi Ketidakpastian di Sub-DAS Bompon\n\n### **Tujuan**\nPeserta mampu menjalankan alur kerja *Digital Soil Mapping* (DSM) secara menyeluruh menggunakan bahasa pemrograman Python dan QGIS—mulai dari ekstraksi matriks desain kovariat $\\text{SCORPAN}$ pada 50 titik sampel, seleksi fitur *Recursive Feature Elimination* (RFE), pelatihan dan evaluasi validasi silang LOOCV empat algoritma (RF, QRF, CatBoost, dan *Stacking Ensemble*), penghitungan metrik akurasi ($R^2$, $\\text{RMSE}$, $\\text{MAE}$, $\\text{CCC}$, $\\text{PICP}_{90}$), hingga pembuatan peta prediksi tekstur terkendala $100\\%$ dan peta ketidakpastian $\\text{PIR}_{90}$ di Sub-DAS Bompon.\n\n### **Input Data**\n1. Dataset matriks sampel DSM Sub-DAS Bompon (`Output/assets/modul-8/sampel_dsm_bompon_50titik.csv`) yang memuat koordinat UTM 49S, atribut bentuklahan, penggunaan lahan, nilai kovariat lingkungan hasil tumpangsusun, serta persentase observasi pasir, debu, dan lempung Lapisan 1 ($0\\text{--}20\\text{ cm}$) pada $N = 50$ titik sampel.\n2. Rekaman statistik acuan pemodelan (`Output/assets/modul-8/statistik_modul_8.json`) yang mendokumentasikan hasil pengujian lengkap tanpa dan dengan SMOGN serta bobot RFE dari studi Fatmawati (2026).\n3. Raster citra multispektral Sentinel-2A (`Source/Data Bompon/terbuka/sentinel2_bompon_10m.tif`) dan *Digital Elevation Model* (`Source/Data Bompon/terbuka/copdem_glo30_30m.tif`) beserta vektor batas Sub-DAS Bompon (`Source/Data Bompon/gpkg/bompon_kajian.gpkg`).\n\n### **Software**\n1. **Python 3.10+** dengan pustaka ilmiah dan geospasial: `numpy`, `scipy`, `scikit-learn` (modul `RandomForestRegressor`, `RFE`, `LeaveOneOut`, `StackingRegressor`, `RidgeCV`), `gdal`/`osgeo`, dan `matplotlib` (serta opsional `catboost` dan `smogn` apabila ingin mereplikasi *Gradient Boosting* pohon simetris dan *oversampling* sintetis secara penuh).\n2. **QGIS 3.28+** untuk inspeksi visual tumpukan raster kovariat, simbolisasi peta prediksi tekstur dan ketidakpastian $\\text{PIR}_{90}$, serta penampalan (*overlay*) dengan poligon bentuklahan dan titik sampel.\n\n### **Langkah Kerja**\n\n#### Tahap 1: Eksplorasi Data, Pemeriksaan Komposisional 100%, dan Seleksi Fitur RFE\n1. Buka terminal kerja pada direktori proyek dan periksa isi berkas `Output/assets/modul-8/sampel_dsm_bompon_50titik.csv`. Pastikan seluruh $50$ baris titik pengamatan (`SB-001` hingga `SB-050`) tidak memiliki nilai kosong (*missing value* / `NaN`) pada kolom kovariat (`elevasi_m`, `slope_deg`, `aspect_cos`, `prof_curv`, `twi`, `tpi`, `ndvi`, `ndwi`, `clay_index`) maupun kolom target (`pasir_l1_persen`, `debu_l1_persen`, `lempung_l1_persen`).\n2. Buat skrip analisis atau jalankan kode Python berikut untuk memuat matriks fitur $\\mathbf{X}$ dan vektor target $\\mathbf{y}$, memverifikasi bahwa jumlah $\\text{Pasir} + \\text{Debu} + \\text{Lempung} = 100\\%$ pada setiap titik, serta menjalankan *Recursive Feature Elimination* (RFE) untuk memilih 5 kovariat terpenting:\n\n```python\nimport csv\nimport numpy as np\nfrom sklearn.ensemble import RandomForestRegressor, GradientBoostingRegressor, StackingRegressor\nfrom sklearn.feature_selection import RFE\nfrom sklearn.linear_model import RidgeCV\nfrom sklearn.model_selection import LeaveOneOut\n\n# 1. Baca data sampel 50 titik Sub-DAS Bompon\nfitur_nama = [\"elevasi_m\", \"slope_deg\", \"aspect_cos\", \"prof_curv\", \"twi\", \"tpi\", \"ndvi\", \"ndwi\", \"clay_index\"]\nX_list, y_pasir, y_debu, y_lempung = [], [], [], []\n\nwith open(\"Output/assets/modul-8/sampel_dsm_bompon_50titik.csv\", \"r\", encoding=\"utf-8\") as f:\n    reader = csv.DictReader(f)\n    for row in reader:\n        X_list.append([float(row[k]) for k in fitur_nama])\n        y_pasir.append(float(row[\"pasir_l1_persen\"]))\n        y_debu.append(float(row[\"debu_l1_persen\"]))\n        y_lempung.append(float(row[\"lempung_l1_persen\"]))\n\nX = np.array(X_list, dtype=np.float64)\nY = {\"Pasir\": np.array(y_pasir), \"Debu\": np.array(y_debu), \"Lempung\": np.array(y_lempung)}\n\n# Verifikasi syarat komposisional tertutup 100%\ntotal_cek = Y[\"Pasir\"] + Y[\"Debu\"] + Y[\"Lempung\"]\nprint(f\"Rentang jumlah komposisi (N={len(X)}): {total_cek.min():.2f}% s.d. {total_cek.max():.2f}%\")\n\n# 2. Seleksi 5 kovariat terbaik per fraksi dengan RFE\nindeks_rfe = {}\nfor nama_fraksi, y_vec in Y.items():\n    rf_dasar = RandomForestRegressor(n_estimators=200, random_state=42)\n    selektor = RFE(estimator=rf_dasar, n_features_to_select=5, step=1)\n    selektor.fit(X, y_vec)\n    indeks_rfe[nama_fraksi] = selektor.support_\n    terpilih = [fitur_nama[i] for i, s in enumerate(selektor.support_) if s]\n    print(f\"Kovariat RFE terpilih ({nama_fraksi}): {terpilih}\")\n```\n\n#### Tahap 2: Pelatihan Model, Validasi Silang LOOCV, dan Perhitungan Kuantil Ketidakpastian QRF\n3. Lanjutkan skrip untuk menjalankan evaluasi *Leave-One-Out Cross-Validation* (LOOCV, $50$ lipatan) guna membandingkan model *Random Forest*, *Quantile Regression Forest* (dihitung dari distribusi empiris prediksi seluruh pohon keputusan di dalam hutan), *Gradient Boosting*, serta *Stacking Ensemble*:\n\n```python\ndef metrik_dsm(y_asli, y_pred):\n    ss_res = np.sum((y_asli - y_pred) ** 2)\n    ss_tot = np.sum((y_asli - np.mean(y_asli)) ** 2)\n    r2 = 1.0 - (ss_res / ss_tot)\n    rmse = np.sqrt(np.mean((y_asli - y_pred) ** 2))\n    mae = np.mean(np.abs(y_asli - y_pred))\n    r = np.corrcoef(y_asl
