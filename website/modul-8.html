i, y_pred)[0, 1]\n    sy, sp = np.std(y_asli), np.std(y_pred)\n    ccc = (2 * r * sy * sp) / (sy**2 + sp**2 + (np.mean(y_asli) - np.mean(y_pred))**2)\n    return r2, rmse, mae, ccc\n\nloo = LeaveOneOut()\nfor nama_fraksi, y_vec in Y.items():\n    X_sub = X[:, indeks_rfe[nama_fraksi]]\n    pred_rf, pred_st, q05_list, q95_list = np.zeros(len(y_vec)), np.zeros(len(y_vec)), np.zeros(len(y_vec)), np.zeros(len(y_vec))\n\n    for idx_latih, idx_uji in loo.split(X_sub):\n        X_tr, y_tr = X_sub[idx_latih], y_vec[idx_latih]\n        X_te = X_sub[idx_uji]\n\n        # Model RF \u0026 ekstraksi distribusi pohon untuk kuantil QRF (q0.05 dan q0.95)\n        rf = RandomForestRegressor(n_estimators=300, min_samples_leaf=2, random_state=42)\n        rf.fit(X_tr, y_tr)\n        pred_rf[idx_uji] = rf.predict(X_te)\n        pred_pohon = np.array([pohon.predict(X_te)[0] for pohon in rf.estimators_])\n        q05_list[idx_uji] = np.percentile(pred_pohon, 5)\n        q95_list[idx_uji] = np.percentile(pred_pohon, 95)\n\n        # Model Stacking Ensemble (RF + Gradient Boosting -\u003e Ridge Meta-Learner)\n        gb = GradientBoostingRegressor(n_estimators=150, max_depth=3, learning_rate=0.05, random_state=42)\n        stack = StackingRegressor(\n            estimators=[(\"rf\", rf), (\"gb\", gb)],\n            final_estimator=RidgeCV(),\n            cv=5\n        )\n        stack.fit(X_tr, y_tr)\n        pred_st[idx_uji] = stack.predict(X_te)\n\n    r2_st, rmse_st, mae_st, ccc_st = metrik_dsm(y_vec, pred_st)\n    picp90 = np.mean((y_vec \u003e= q05_list) \u0026 (y_vec \u003c= q95_list)) * 100.0\n    pir90_rerata = np.mean(q95_list - q05_list)\n    print(f\"{nama_fraksi:8s} | Stacking R2={r2_st:.3f}, RMSE={rmse_st:.2f}%, MAE={mae_st:.2f}%, CCC={ccc_st:.3f} | PICP90={picp90:.1f}%, Rerata PIR90={pir90_rerata:.2f}%\")\n```\n\n#### Tahap 3: Inferensi Spasial Seluruh Grid Sub-DAS Bompon dan Normalisasi Penutupan 100%\n4. Jalankan skrip pemetaan penuh `python3 Output/scripts/gambar_modul_8.py` untuk menerapkan model terlatih ke seluruh grid piksel beresolusi $10\\text{ m}$ di Sub-DAS Bompon, melakukan normalisasi penutupan $\\hat{y}_{\\text{pasir}} + \\hat{y}_{\\text{debu}} + \\hat{y}_{\\text{lempung}} = 100\\%$, serta menghitung raster ketidakpastian $\\text{PIR}_{90}$.\n5. Muat peta keluaran (`Output/assets/modul-8/M8-G06_peta-prediksi-dan-ketidakpastian-tekstur-bompon.png`) dan tabel statistik (`Output/assets/modul-8/statistik_modul_8.json`) untuk membandingkan sebaran nilai prediksi terhadap poligon bentuklahan dan kemiringan lereng di QGIS.\n\n### **Expected Output**\n1. Keluaran terminal yang menampilkan daftar kovariat terpilih hasil seleksi RFE untuk setiap fraksi tekstur, metrik validasi silang LOOCV ($R^2$, $\\text{RMSE}$, $\\text{MAE}$, $\\text{CCC}$), serta nilai cakupan interval prediksi $\\text{PICP}_{90}$ dan rata-rata lebar ketidakpastian $\\text{PIR}_{90}$.\n2. Berkas tabel matriks desain dan observasi 50 titik sampel (`Output/assets/modul-8/sampel_dsm_bompon_50titik.csv`) serta berkas ringkasan evaluasi (`Output/assets/modul-8/statistik_modul_8.json`).\n3. Enam berkas visualisasi publikasi (`M8-G01` hingga `M8-G06`) pada folder `Output/assets/modul-8/`, termasuk peta prediksi spasial fraksi pasir, debu, lempung Lapisan 1 ($0\\text{--}20\\text{ cm}$) dan peta ketidakpastian $\\text{PIR}_{90}$.\n\n### **Interpretation**\n1. **Dominasi Kovariat Morfometri Lereng ($R$)**: Perhatikan pada hasil seleksi RFE bahwa variabel kelengkungan lereng (*Profile curvature*, *Plan curvature*), kemiringan lereng (*Slope*), indeks kebasahan topografi ($\\text{TWI}$), dan indeks kedalaman/kemendataran lembah (*Valley depth*, $\\text{MrVBF}$) selalu terpilih sebagai prediktor utama. Hal ini membuktikan secara kuantitatif bahwa diferensiasi tekstur tanah permukaan di Sub-DAS Bompon dikendalikan oleh proses redistribusi sedimen lateral (erosi selektif pada punggung/lereng cembung dan deposisi debu/lempung pada kaki lereng/cekungan lembah).\n2. **Kesesuaian Statistik Rata-rata dan Penyusutan Varians**: Bandingkan rata-rata dan simpangan baku peta prediksi terhadap data laboratorium pada Tabel 8.3. Nilai rata-rata regional ketiga fraksi tekstur tereproduksi secara akurat ($\\text{Lempung} \\approx 62,3\\%$, $\\text{Debu} \\approx 20,9\\%$, $\\text{Pasir} \\approx 16,5\\%$), sehingga klasifikasi kelas tekstur USDA di seluruh Sub-DAS Bompon tetap konsisten berada pada kelas **Lempung (*Clay*) hingga Lempung Berdebu (*Silty Clay*)**. Penyusutan simpangan baku prediksi ($\\text{STD}$ lempung turun dari $9,82\\%$ menjadi $4,89\\%$) harus diinterpretasikan sebagai konsekuensi matematis dari perata-rataan ansambel pohon keputusan.\n3. **Pemanfaatan Peta Ketidakpastian ($\\text{PIR}_{90}$) untuk Rekomendasi Pengelolaan Lahan**: Piksel-piksel yang memiliki prediksi pasir/debu tinggi sekaligus $\\text{PIR}_{90}$ lebar ($\u003e 26\\%$) pada tebing berlereng curam menandakan zona kritis yang rawan mengalami degradasi fisik dan longsor dangkal. Pada zona tersebut, rekomendasi konservasi tanah (seperti penguatan teras bangku, penanaman rumput penguat tebing, dan pengurangan pengolahan tanah intensif) wajib diprioritaskan, sembari menjadwalkan pengambilan sampel tanah tambahan pada kampanye survei berikutnya.\n\n### **Troubleshooting**\n1. **Masalah: Nilai $R^2$ validasi silang LOOCV menjadi negatif atau turun drastis ketika seluruh 22 kovariat dimasukkan sekaligus.**\n   - *Penyebab*: Terjadi *overfitting* dan pengenceran fitur informatif akibat multikolinearitas tinggi di antara 14 kovariat turunan DTM pada ukuran sampel kecil ($N = 50$).\n   - *Solusi*: Jalankan seleksi fitur *Recursive Feature Elimination* (RFE) terlebih dahulu untuk memangkas jumlah prediktor menjadi $5\\text{--}10$ kovariat terbaik per target, serta batasi kedalaman maksimum pohon atau tetapkan `min_samples_leaf \u003e= 2` pada *Random Forest*.\n2. **Masalah: Jumlah piksel peta prediksi $\\hat{y}_{\\text{pasir}} + \\hat{y}_{\\text{debu}} + \\hat{y}_{\\text{lempung}}$ tidak tepat bernilai $100\\%$ dan muncul artefak kotak-kotak kasar (*blocky artifacts*) berukuran $30\\text{ m}$ pada peta prediksi $10\\text{ m}$.**\n   - *Penyebab*: Ketiga model fraksi tekstur diprediksi secara independen tanpa normalisasi penutupan komposisional, serta raster DEM $30\\text{ m}$ di-*resample* menggunakan metode *nearest neighbor* atau *bilinear* mentah sebelum diturunkan menjadi kemiringan dan kelengkungan lereng.\n   - *Solusi*: Terapkan normalisasi penutupan komposisional ($\\hat{y}_c / \\sum \\hat{y}_k \\times 100\\%$) atau transformasi *Additive Log-Ratio* ($\\text{ALR}$), dan gunakan interpolasi *bicubic spline* (`order=3`) yang diikuti penghalusan tapis Gauss ber-sigma kecil ($\\sigma \\approx 1,2\\text{--}1,4$ piksel) saat menyelaraskan DEM ke resolusi $10\\text{ m}$.\n3. **Masalah: Nilai $R^2$ pengujian terlihat sangat tinggi ($\u003e 0,80$) ketika menggunakan SMOGN, tetapi peta prediksi yang dihasilkan terlihat tidak realistis di lapangan.**\n   - *Penyebab*: Terjadi kebocoran data (*data leakage*) karena fungsi `smogn.smoter()` dijalankan pada keseluruhan tabel data ($N = 50$) **sebelum** pemisahan lipatan latih dan uji. Akibatnya, titik sintetis hasil duplikasi titik uji ikut masuk ke dalam himpunan latih.\n   - *Solusi*: Pastikan fungsi *resampling* SMOGN dieksekusi secara ketat **hanya di dalam blok `X_train, y_train`** pada setiap iterasi validasi silang, dan biarkan titik uji (`X_test, y_test`) tetap berupa data observasi laboratorium murni tanpa modifikasi.\n4. **Masalah: Nilai $\\text{PICP}_{90}$ jauh di bawah $90\\%$ (misalnya hanya $55\\text{--}65\\%$) sehingga interval ketidakpastian $\\text{PIR}_{90}$ terlalu sempit.**\n   - *Penyebab*: Kuantil $\\hat{q}_{0,05}$ dan $\\hat{q}_{0,95}$ dihitung hanya dari rata-rata prediksi pohon (`pohon.predict(X)`), bukan dari keseluruhan sebaran observasi di dalam simpul daun seperti pada definisi asli Meinshausen (2006), atau pohon dipangkas terlalu dangkal.\n   - *Solusi*: Biarkan pohon QRF tumbuh mendalam (`max_depth=None`, `min_samples_leaf=1` atau `2`) dan hitung kuantil berdasarkan bobot kesamaan simpul daun terhadap nilai observasi asli $y_i$, atau terapkan *conformalized quantile regression* untuk mengalibrasi lebar interval prediksi.\n\n---\n\n## Rangkuman\n\n1. Kerangka **$\\text{SCORPAN}$** ($S = f(s, c, o, r, p, a, n) + \\varepsilon$) mentransformasikan konsep faktor pembentuk tanah klasik menjadi fungsi empiris-kuantitatif yang mengintegrasikan pengamatan titik lapangan dengan tumpukan kovariat penginderaan jauh dan morfometri medan. Di Sub-DAS Bompon, variasi tekstur tanah dikendalikan oleh 22 kovariat yang mewakili faktor tanah ($S$: *Clay Index*), organisme ($O$: $\\text{NDVI}$, $\\text{SAVI}$, $\\text{EVI}$, $\\text{NDWI}$, penggunaan lahan), relief ($R$: 14 parameter turunan DTM), bahan induk ($P$: satuan material tutupan), dan posisi ruang ($N$: jarak dari sungai).\n2. Analisis laboratorium pada $N = 50$ titik sampel di Sub-DAS Bompon menunjukkan bahwa matriks tanah didominasi oleh fraksi lempung (rata-rata $62,48\\%$ pada $0\\text{--}20\\text{ cm}$ dan $64,78\\%$ pada $20\\text{--}40\\text{ cm}$), reaksi tanah masam ($\\text{pH H}_2\\text{O} \\approx 5,20\\text{--}5,23$), C-organik rendah ($1,13\\%$ dan $0,92\\%$), serta Kapasitas Pertukaran Kation (KPK) yang rendah ($8,99$ dan $9,22\\text{ cmol(+)/kg}$). Nisbah KPK terhadap kadar lempung yang rendah ($\\sim 14\\text{ cmol(+)/kg lempung}$) mengonfirmasi dominasi mineral lempung tipe 1:1 beraktivitas rendah (kaolinit/haloisit) hasil pelapukan tropis lanjut atas breksi vulkanik.\n3. Empat algoritma pembelajaran mesin yang dikaji memiliki peran komplementer: **Random Forest (RF)** menekan varians prediksi melalui *bagging* pohon independen; **Quantile Regression Forest (QRF)** menaksir distribusi kumulatif bersyarat penuh untuk menghasilkan interval ketidakpastian $\\text{PI}_{90}$; **CatBoost** menurunkan bias melalui *boosting* sekuensial pohon simetris (*oblivious trees*) dan *ordered boosting* yang tahan terhadap kebocoran target pada sampel kecil; sedangkan **Stacking Ensemble** mengombinasikan prediksi *out-of-fold* ketiga model dasar melalui *meta-learner* sehingga menghasilkan akurasi tertinggi di seluruh fraksi tekstur.\n4. Pada ukuran sampel terbatas ($N = 50$) dengan distribusi target yang miring, kombinasi validasi silang **LOOCV**, seleksi fitur **RFE** (menyaring $5\\text{--}10$ prediktor kunci), dan penyeimbangan sampel sintetis **SMOGN** meningkatkan kinerja model *Stacking* secara signifikan pada variabel dengan koefisien variasi tinggi—yakni Pasir Lapisan 1 ($R^2$ meningkat dari $0,081$ menjadi $0,249$; $\\text{RMSE} = 5,840\\%$) dan Debu Lapisan 1 ($R^2$ meningkat dari $0,159$ menjadi $0,196$; $\\text{RMSE} = 5,820\\%$)—tetapi tidak diperlukan pada Lempung Lapisan 2 yang distribusinya sudah homogen ($R^2 = 0,184$ tanpa SMOGN).\n5. Evaluasi tingkat kepentingan variabel RFE membuktikan bahwa **faktor Relief ($R$)** mengendalikan lebih dari $80\\%$ variasi spasial tekstur tanah di Sub-DAS Bompon (*Aspect*, *Profile/Plan curvature*, *Slope*, $\\text{TWI}$, *Valley depth*, $\\text{MrVBF}$, dan $\\text{MrRTF}$), dilengkapi oleh *Clay Index* ($19,13\\%$ pada Pasir Lapisan 1), *Jarak dari sungai* ($8,55\\%$ pada Debu Lapisan 1), serta $\\text{NDWI}$ dan $\\text{NDVI}$ pada Lempung Lapisan 2.\n6. Seluruh model berbasis ansambel menunjukkan gejala penghalusan ekor distribusi (*smoothing of distribution tails*) yang menyusutkan simpangan baku peta prediksi sebesar $50\\text{--}65\\%$ dibandingkan data laboratorium meskipun nilai rata-rata dan rentang ekstrem berhasil dipertahankan. Oleh karena itu, penyajian peta prediksi DSM wajib selalu didampingi oleh normalisasi penutupan komposisional $100\\%$ serta peta ketidakpastian spasial ($\\text{PIR}_{90} = \\hat{q}_{0,95} - \\hat{q}_{0,05}$) sebagai dasar pengelolaan lahan dan konservasi tanah berbasis risiko.\n\n---\n\n## Daftar Pustaka\n\nAitchison, J. (1986). *The Statistical Analysis
