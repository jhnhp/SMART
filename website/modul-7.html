<script id="module-source" type="application/json">"# Proximal Soil Sensing\n\n## Tujuan dan Capaian Pembelajaran\n\nModul-modul terdahulu telah membekali peserta dengan kemampuan mengolah citra penginderaan jauh satelit serta menginterpretasikan pola bentang lahan untuk pemetaan tanah. Meskipun demikian, evaluasi kita pada Modul 5 dan Modul 6 secara jujur memperlihatkan tiga keterbatasan struktural dari penginderaan jauh ruang angkasa (*spaceborne remote sensing*) di wilayah beriklim tropis basah: (1) terhalangnya permukaan tanah oleh tajuk vegetasi tahunan yang rapat (seperti kebun campur di Sub-DAS Bompon maupun blok kelapa sawit tanaman menghasilkan), (2) dangkalnya penetrasi gelombang optik yang hanya menyentuh kulit terluar permukaan tanah setebal $0\\text{–}2\\text{ mm}$, serta (3) lebarnya pita spektral sensor multispektral yang menyamarkan fitur serapan ikatan molekul spesifik mineral lempung dan bahan organik. Di sisi lain, analisis laboratorium kimia basah dan fisika tanah konvensional (seperti metode pipet/hidrometer untuk tekstur, pengabuan basah Walkley–Black untuk karbon organik, atau ekstraksi amonium asetat untuk kation dapat ditukar) membutuhkan biaya per sampel yang mahal, waktu tunggu berminggu-minggu, serta reagen kimia berbahaya (Viscarra Rossel et al., 2006; Nocita et al., 2015).\n\nUntuk menjembatani kesenjangan antara pengamatan satelit yang luas namun dangkal dan analisis laboratorium konvensional yang akurat namun lambat, lahirlah disiplin **penginderaan tanah jarak dekat (*Proximal Soil Sensing* / PSS)** (Viscarra Rossel et al., 2011). Dengan menempatkan sensor optik, spektroskopi atomik, atau geofisika elektromagnetik dalam jarak kurang dari 2 meter (atau berkontak langsung) dengan matriks tanah, PSS mampu merekam tanda spektral dan fisika tanah secara cepat, tidak merusak (*non-destructive*), dan menjangkau berbagai kedalaman profil tanah. Setelah mempelajari modul ini, peserta pelatihan diharapkan mampu:\n\n1. Menjelaskan konsep dasar *Proximal Soil Sensing* (PSS), klasifikasi instrumen menurut spektrum elektromagnetik, sifat invasif, dan moda akuisisinya (laboratorium, titik lapangan, pemindaian inti bor, dan bergerak / *on-the-go*).\n2. Membandingkan secara kritis keunggulan, keterbatasan, dan sinergi antara *Remote Sensing* (RS) dan *Proximal Soil Sensing* (PSS) dalam kerangka survei tanah modern dan manajemen agronomi perkebunan kelapa sawit.\n3. Menginterpretasikan fitur serapan diagnostik pada kurva pantulan spektral *Visible–Near Infrared–Shortwave Infrared* (Vis–NIR–SWIR, $350\\text{–}2.500\\text{ nm}$) dan *Mid-Infrared* (MIR) yang berasosiasi dengan oksida besi, air tanah, gugus $\\text{Al–OH}$ / $\\text{Mg–OH}$ mineral lempung, serta ikatan karbon organik.\n4. Menerapkan teknik prapemrosesan kemometrik—meliputi transformasi absorbansi $\\log_{10}(1/R)$, *Standard Normal Variate* (SNV), filter turunan Savitzky–Golay, dan *Continuum Removal* (CR)—serta membangun model kalibrasi *Partial Least Squares Regression* (PLSR) untuk menduga kadar lempung tanah.\n\n---\n\n*Ceramah dan diskusi:*\n\n## Konsep Proximal Soil Sensing\n\n### Definisi dan Ruang Lingkup Proximal Soil Sensing\n\nSecara formal, **Proximal Soil Sensing (PSS)** didefinisikan oleh Viscarra Rossel et al. (2010) dan Viscarra Rossel et al. (2011) sebagai penggunaan sensor lapangan maupun laboratorium untuk memperoleh sinyal dari tanah ketika detektor sensor berada dalam kontak langsung dengan tanah atau berjarak dekat (kurang dari 2 meter) dari permukaan maupun profil tanah. Batasan jarak 2 meter tersebut bukan sekadar angka arbitrer, melainkan membedakan rezim fisika pengukuran: pada jarak $\u003c2\\text{ m}$ (terutama ketika menggunakan probe kontak beriluminasi internal), lintasan radiasi terbebas sepenuhnya dari kolom atmosfer bumi, tidak terganggu oleh tutupan tajuk pohon di atasnya, dan memungkinkan pengontrolan geometri penyinaran secara presisi.\n\nDalam alur kerja pemetaan tanah digital (*Digital Soil Mapping* / DSM), PSS menjalankan dua peran utama sekaligus:\n\n1. **Sebagai pengganti atau pelengkap analisis laboratorium berkecepatan tinggi (*high-throughput soil spectroscopy*)**: Sampel tanah yang diambil dari lapangan (misalnya pada kedalaman 0–20 cm dan 20–40 cm sebagaimana dilakukan pada 50 titik sampel Sub-DAS Bompon) dikeringudarakan, diayak lolos $2\\text{ mm}$, lalu dipindai menggunakan spektrometer Vis–NIR–SWIR atau FTIR dalam hitungan detik per sampel. Sebagian kecil sampel (misalnya 20–30% himpunan kalibrasi yang dipilih secara representatif menggunakan algoritma *Kennard–Stone* atau *conditioned Latin Hypercube*) dianalisis secara kimia basah di laboratorium untuk melatih model kemometrik, yang kemudian digunakan untuk memprediksi sifat tanah pada ratusan hingga ribuan sampel sisanya dengan biaya mendekati nol (Shepherd \u0026 Walsh, 2002; Viscarra Rossel et al., 2016).\n2. **Sebagai penghasil kovariat spasial berkerapatan sangat tinggi di lapangan (*in-situ and on-the-go sensing*)**: Sensor geofisika seperti induksi elektromagnetik (*Electromagnetic Induction* / EMI) atau spektrometer kontak yang dipasang pada kendaraan segala medan (*All-Terrain Vehicle* / ATV) ditarik menyusuri lorong gawangan kebun untuk memetakan variasi konduktivitas listrik, kelembapan, dan tekstur zona perakaran secara kontinu setiap beberapa meter (Adamchuk et al., 2004; Doolittle \u0026 Brevik, 2014).\n\n### Taksonomi Instrumen Proximal Soil Sensing\n\nBerdasarkan posisi panjang gelombang pada spektrum elektromagnetik serta prinsip fisika interaksinya dengan fase padat, cair, dan gas tanah, instrumen PSS dikelompokkan ke dalam empat keluarga teknologi utama sebagaimana divisualisasikan pada Gambar 7.1.\n\n![](assets/modul-7/M7-G01_taksonomi-instrumen-proximal-soil-sensing.png)\nGambar 7.1 Taksonomi empat keluarga utama instrumen Proximal Soil Sensing (PSS) berdasarkan rentang spektrum elektromagnetik, mekanisme fisik interaksi energi-materi, sifat tanah target, dan moda akuisisinya.\nSumber: Disintesis dari Adamchuk et al. (2004), Viscarra Rossel et al. (2011), dan Nocita et al. (2015).\n\n1. **Spektroskopi Reflektansi Optik dan Inframerah (*Vis–NIR–SWIR dan MIR Spectroscopy*)**\n   - **Spektroskopi *Visible–Near Infrared–Shortwave Infrared* (Vis–NIR–SWIR, $350\\text{–}2.500\\text{ nm}$ atau bilangan gelombang $28.570\\text{–}4.000\\text{ cm}^{-1}$)**: Instrumen standar seperti *ASD FieldSpec* atau *PSR+* menggabungkan tiga detektor (silikon untuk $350\\text{–}1.000\\text{ nm}$ serta *cooled InGaAs* untuk $1.000\\text{–}1.800\\text{ nm}$ dan $1.800\\text{–}2.500\\text{ nm}$) guna merekam hingga $2.151$ kanal kontinu beresolusi $1\\text{ nm}$. Radiasi pada rentang ini memicu transisi elektronik ion logam transisi ($\\text{Fe}^{2+}, \\text{Fe}^{3+}$) di daerah tampak–NIR serta **nada atas (*overtones*) dan pita kombinasi (*combination bands*)** dari vibrasi ulur (*stretching*) dan tekuk (*bending*) ikatan molekul $\\text{O–H}, \\text{C–H}, \\text{N–H}, \\text{Al–OH}, \\text{Fe–OH}$, dan $\\text{CO}_3^{2-}$ di daerah SWIR (Clark, 1999; Stenberg et al., 2010). Spektrometer Vis–NIR–SWIR sangat tangguh untuk penggunaan lapangan karena radiasinya mampu menembus kuarsa tanpa serapan berlebih dan toleran terhadap sampel tanah tanpa penggerusan halus.\n   - **Spektroskopi Inframerah Tengah (*Mid-Infrared* / MIR, $2.500\\text{–}25.000\\text{ nm}$ atau $4.000\\text{–}400\\text{ cm}^{-1}$)**: Memanfaatkan teknologi *Fourier Transform Infrared* (FTIR) dengan teknik *Diffuse Reflectance* (DRIFT) atau *Attenuated Total Reflectance* (ATR). Berbeda dengan SWIR yang hanya merekam gema nada atas (*overtones*) yang lemah dan saling bertumpang-tindih, rentang MIR merekam langsung **vibrasi fundamental ($v_1, v_2, v_3$)** dari gugus fungsional bahan organik (alkil alifatik, karboksilat, amida, aromatik), kuarsa (*stretching* $\\text{Si–O}$ pada $\\sim 1.100\\text{–}1.000\\text{ cm}^{-1}$), dan mineral lempung (kaolinit pada $3.695\\text{–}3.620\\text{ cm}^{-1}$). Akibatnya, model kalibrasi MIR umumnya menghasilkan akurasi prediksi karbon organik, kapasitas tukar kation (KTK), dan fraksi tekstur yang sedikit lebih tinggi dibandingkan Vis–NIR–SWIR, namun mensyaratkan pengeringan sampel yang ketat dan penggerusan halus ($\u003c0{,}1\\text{–}0{,}2\\text{ mm}$) di laboratorium (Minasny \u0026 McBratney, 2008; Soriano-Disla et al., 2014).\n\n2. **Spektroskopi Unsur Atomik (*pXRF dan LIBS*)**\n   - ***Portable X-Ray Fluorescence* (pXRF)**: Menembakkan foton sinar-X berenergi tinggi ke permukaan tanah sehingga melepaskan elektron kulit dalam ($K$ dan $L$) dari atom-atom penyusun tanah. Ketika elektron dari kulit luar jatuh mengisi kekosongan tersebut, dipancarkan sinar-X fluoresensi sekunder dengan energi yang spesifik bagi setiap unsur kimia (Weindorf et al., 2014). pXRF mampu mengukur konsentrasi total unsur mulai dari magnesium ($\\text{Mg}$) hingga uranium ($\\text{U}$)—termasuk $\\text{Si}, \\text{Al}, \\text{Fe}, \\text{Ti}, \\text{Zr}, \\text{K}, \\text{Ca}, \\text{P}, \\text{Mn}, \\text{Cu}$, dan $\\text{Zn}$—dalam waktu 60–90 detik di lapangan. Rasio unsur tahan lapuk seperti $\\text{Ti/Zr}$ dan indeks pelapukan kimia ($\\text{Al}_2\\text{O}_3 / (\\text{Al}_2\\text{O}_3 + \\text{CaO} + \\text{Na}_2\\text{O} + \\text{K}_2\\text{O})$) dari pXRF sangat ampuh untuk membedakan bahan induk litologi dan cadangan hara mineral di kebun kelapa sawit.\n   - ***Laser-Induced Breakdown Spectroscopy* (LIBS)**: Memfokuskan pulsa laser berenergi tinggi (misalnya Nd:YAG $1.064\\text{ nm}$) untuk menguapkan mikro-volume tanah menjadi plasma bersuhu tinggi ($\\sim 10.000\\text{ K}$), lalu membaca spektrum emisi atom saat plasma mendingin, termasuk unsur ringan seperti karbon ($\\text{C}$ pada $193\\text{ nm}$ atau $247{,}8\\text{ nm}$) dan nitrogen (Villas-Boas et al., 2020).\n\n3. **Sensor Geofisika Elektromagnetik dan Radar Tanah (*EMI, ERT, dan GPR*)**\n   - ***Electromagnetic Induction* (EMI)**: Instrumen seperti *Geonics EM38* atau *DUALEM* memiliki kumparan pemancar (*transmitter coil*) yang membangkitkan medan magnet primer berfrekuensi kHz guna menginduksi arus pusar (*eddy currents*) di dalam tanah, serta kumparan penerima (*receiver coil*) yang mengukur medan magnet sekunder untuk menghitung **konduktivitas listrik semu tanah (*apparent electrical conductivity* / $\\text{EC}_a$, dalam $\\text{mS/m}$)** (Corwin \u0026 Lesch, 2005; Doolittle \u0026 Brevik, 2014). Nilai $\\text{EC}_a$ dikendalikan oleh tiga jalur konduksi: kandungan air pori, kadar dan jenis mineral lempung, serta konsentrasi garam terlarut. Dengan mengatur jarak antar-kumparan dan orientasi dipol (horizontal vs vertikal), EMI dapat mengukur profil tanah hingga kedalaman efektif $0{,}5\\text{ m}$, $1{,}0\\text{ m}$, dan $1{,}5\\text{ m}$ tanpa menggali tanah sedikit pun.\n   - ***Ground Penetrating Radar* (GPR)**: Memancarkan pulsa gelombang mikro frekuensi tinggi ($100\\text{–}1.000\\text{ MHz}$) ke dalam tanah dan merekam waktu tempuh pantulan (*two-way travel time*) pada bidang batas perubahan konstanta dielektrik. Di perkebunan Indonesia, GPR dan EMI sangat bernilai untuk memetakan variasi ketebalan lapisan gambut di atas substrat lempung marin/kuarsa serta mendeteksi kedalaman padas (*hardpan*), kontak litik, atau muka air tanah.\n\n4. **Radiometri Sinar Gama ($\\gamma$-ray), Sensor Elektrokimia, dan Mekanis**\n   - **Spektrometri Sinar Gama ($\\gamma$-ray)**: Sensor pasif (kristal sintilasi $\\text{NaI(Tl)}$ atau $\\text{CsI}$) yang mengukur pancaran sinar gama alami dari peluruhan radioisotop kalium ($^{40}\\text{K}$ pada $1{,}46\\text{ MeV}$), uranium ($^{238}\\text{U}/^{214}\\text{Bi}$ pada $1{,}76\\text{ MeV}$), dan torium ($^{232}\\text{Th}/^{208}\\text{Tl}$ pada $2{,}62\\text{ MeV}$) dari lapisan tanah atas sedalam $0\\text{–}30\\text{ cm}$ (Viscarra Rossel et al., 2007). Karena $^{40}\\text{K}$ terkonsentrasi pada mineral feldspar dan mika/ilit yang belum terlapuk habis, sedangkan $^{232}\\text{Th}$ terikat kuat pada lempung kaolinit dan seskuioksida besi-aluminium hasil pelapukan lanjut, peta rasio $\\text{Th/K}$ menjadi indikator unggul untuk memisahkan tanah volkanik muda (*Inceptisols*) dari tanah terlapuk lanjut (*Ultisols/Oxisols*).\n   - **Elektroda Selektif Ion (*Ion-Selective Electrodes* / ISE) dan Penetrometer Konus**: Digunakan secara invasif untuk mengukur aktivitas ion $\\text{H}^+$ (pH tanah), $\\text{NO}_3^-$, atau $\\text{K}^+$ secara langsung serta memprofilkan tahanan penetrasi (*cone index* dalam $\\text{MPa}$) guna mendeteksi lapisan pemadatan tanah di jalur panen kebun sawit.\n\n---\n\n## Perbedaan Remote Sensing dan Proximal Soil Sensing\n\nMemahami perbedaan mendasar antara penginderaan jauh (*Remote Sensing* / RS) dan penginderaan tanah jarak dekat (*Proximal Soil Sensing* / PSS) sangat penting agar praktisi tidak salah menuntut kemampuan dari masing-masing teknologi. Gambar 7.2 membandingkan geometri akuisisi, gangguan media perantara, cakupan kedalaman profil, serta resolusi spektral antara RS satelit dan PSS.\n\n![](assets/modul-7/M7-G02_komparasi-skala-rs-vs-pss.png)\nGambar 7.2 Perbandingan fundamental antara Remote Sensing (RS) dan Proximal Soil Sensing (PSS): (a) skema geometri pengamatan, gangguan atmosfer-kanopi, dan jangkauan kedalaman profil tanah; (b) perbandingan kurva spektrum kontinu PSS (resolusi 1–2 nm) dengan pencuplikan 10 kanal diskrit Sentinel-2 MSI yang melewatkan struktur halus *doublet* kaolinit dan puncak air.\nSumber: Disintesis dari Ben-Dor et al. (2009), Viscarra Rossel et al. (2011), dan spesifikasi kanal ESA Sentinel-2 MSI.\n\nSebagaimana ditunjukkan secara visual pada Gambar 7.2 dan dirinci secara komparatif pada Tabel 7.1, perbedaan antara RS dan PSS mencakup enam dimensi teknis utama:\n\n1. **Resolusi Spektral dan Lebar Pita (*Bandwidth* / FWHM)**:\n   Sensor multispektral satelit seperti Sentinel-2 MSI hanya mencuplik spektrum pantulan pada 10–13 titik diskrit dengan lebar pita penuh pada setengah maksimum (*Full Width at Half Maximum* / FWHM) sebesar $15\\text{–}180\\text{ nm}$ (kotak biru transparan pada Gambar 7.2b). Pada kanal $\\text{B12}$ Sentinel-2 yang berpusat di $2.190\\text{ nm}$ dengan lebar $180\\text{ nm}$ ($2.100\\text{–}2.280\\text{ nm}$), seluruh struktur pita serapan *doublet* khas kaolinit pada $2.165\\text{ nm}$ dan $2.208\\text{ nm}$, pita smektit pada $2.205\\text{ nm}$, serta pita ilit/mika pada $2.200\\text{ nm}$ dan $2.345\\text{ nm}$ dilebur menjadi satu nilai rata-rata tunggal! Sebaliknya, spektrometer PSS Vis–NIR–SWIR memiliki resolusi pengambilan sampel $1\\text{ nm}$ (FWHM $3\\text{–}10\\text{ nm}$) sehingga mampu memisahkan bentuk asimetri dan pergeseran panjang gelombang puncak serapan antar-jenis mineral lempung secara eksak.\n2. **Jendela Atmosfer (*Atmospheric Windows*) vs Spektrum Penuh**:\n   Pada citra satelit maupun wahana udara, radiasi matahari yang merambat menembus atmosfer bumi diserap habis oleh uap air atmosferik di sekitar $1.400\\text{ nm}$ dan $1.900\\text{ nm}$ (sehingga tidak ada kanal satelit optik yang ditempatkan di kedua pita tersebut). Sebaliknya, pada PSS yang menggunakan sumber cahaya lampu halogen kuarsa internal dengan probe menempel langsung pada sampel tanah, pita $1.414\\text{ nm}$ dan $1.915\\text{ nm}$ justru terekam dengan rasio sinyal-terhadap-derau (*Signal-to-Noise Ratio* / SNR) yang sangat bersih dan menjadi fitur utama untuk mengestimasi kadar air higroskopis serta lempung smektit 2:1.\n3. **Kedalaman Pengamatan Profil Tanah (*Sensing Depth*)**:\n   Citra optik penginderaan jauh hanya merekam pantulan dari lapisan kulit terluar tanah (*soil skin*, $0\\text{–}2\\text{ mm}$) apabila tanah tersebut terbuka, atau bahkan hanya merekam pantulan daun di puncak tajuk pohon setinggi 10–20 meter di atas tanah (Gambar 7.2a). Padahal, dalam klasifikasi taksonomi tanah maupun evaluasi kesesuaian lahan kelapa sawit, sifat tanah pada lapisan olah ($0\\text{–}20\\text{ cm}$), lapisan perakaran aktif ($20\\text{–}40\\text{ cm}$), dan *subsoil* ($40\\text{–}100\\text{ cm}$) memegang peranan penentu. Melalui pemindaian sampel bor tanah (*soil core/auger scanning*), probe penetrasi berjendela safir, maupun sensor geofisika EMI, PSS mampu menghasilkan informasi sifat tanah secara vertikal di seluruh horizon profil (Viscarra Rossel et al., 2011; Ackerson et al., 2017).\n4. **Cakupan Spasial vs Kerapatan Informasi Titik**:\n   Keunggulan mutlak RS satelit terletak pada cakupan spasialnya yang luas (*wall-to-wall coverage*, ratusan hingga ribuan kilometer persegi sekali rekam), konsisten secara geometrik, dan berulang secara temporal (setiap 5–12 hari). Sebaliknya, PSS menghasilkan data yang bersifat titik (*point support*) atau lintasan jalur (*transect support*) sehingga memerlukan interpolasi geostatistik atau penggabungan dengan kovariat RS untuk menghasilkan peta kontinyu di seluruh lanskap.\n\nRingkasan pada Tabel 7.1 menyajikan matriks perbandingan menyeluruh antara penginderaan jauh satelit/udara dan penginderaan tanah jarak dekat.\n\nTabel 7.1 Perbandingan karakteristik teknis, operasional, dan pedologis antara Remote Sensing (RS) dan Proximal Soil Sensing (PSS).\n\n| Parameter Pembanding | Remote Sensing (Satelit / Udara) | Proximal Soil Sensing (Lab / Lapangan / Mobile) | Implikasi Sinergis dalam Pemetaan Tanah Digital |\n| :--- | :--- | :--- | :--- |\n| **Jarak Sensor ke Target** | Ratusan meter (UAV/pesawat) hingga $700\\text{–}800\\text{ km}$ (satelit LEO) | Kontak langsung ($0\\text{ cm}$) hingga $\u003c 2\\text{ m}$ dari permukaan/profil tanah | RS memetakan bentang lahan makro; PSS mengkalibrasi sifat tanah pada lokasi sampel |\n| **Sumber Energi Radiasi** | Pasif (matahari) untuk optik/termal; aktif untuk SAR/LiDAR | Umumnya aktif terkontrol (lampu halogen, laser, sinar-X, medan EM) | PSS tidak bergantung pada cuaca, jam penyinaran, maupun tutupan awan tropis |\n| **Gangguan Atmosfer \u0026 Kanopi** | Sangat dipengaruhi aerosol, uap air, awan, dan bauran tajuk vegetasi | Bebas gangguan atmosfer; pengukuran langsung pada matriks tanah | Di kebun sawit TM atau hutan kebun campur Bompon, PSS tetap bekerja akurat di bawah tajuk |\n| **Resolusi Spektral (Optik)** | Multispektral ($4\\text{–}13$ kanal lebar) atau hiperspektral satelit ($\\sim 10\\text{ nm}$, SNR sedang) | Hiperspektral ultra-halus ($1\\text{–}2\\text{ nm}$ pada Vis–NIR–SWIR; $2\\text{–}4\\text{ cm}^{-1}$ pada MIR) | PSS mampu mengidentifikasi spesies mineral lempung dan gugus fungsional organik spesifik |\n| **Kedalaman Pengamatan Tanah** | Hanya kulit permukaan ($0\\text{–}2\\text{ mm}$ untuk optik; $2\\text{–}5\\text{ cm}$ untuk SAR) | Multi-kedalaman: $0\\text{–}20\\text{ cm}$, $20\\text{–}40\\text{ cm}$, hingga $\u003e100\\text{ cm}$ (inti bor / probe / EMI) | PSS menyediakan data sifat tanah lapisan bawah (*subsoil*) seperti Lapisan 2 (20–40 cm) di Bompon |\n| **Cakupan \u0026 Struktur Spasial** | *Wall-to-wall* (menerus secara spasial di seluruh DAS / konsesi kebun) | Diskrit pada titik pengamatan (*point*) atau sepanjang jalur traktor (*transect*) | Data titik dari PSS dijadikan variabel respon ($Y$) yang dipetakan secara spasial dengan kovariat RS ($X$) |\n\nSumber: Disintesis dari Ben-Dor et al. (2009), Viscarra Rossel et al. (2011), Nocita et al. (2015), dan Chabrillat et al. (2019).\n\n---\n\n## Interpretasi Pantulan Spektral Proximal Soil Sensing\n\n### Mekanisme Fisika-Kimia Serapan Spektral Tanah pada Rentang Vis–NIR–SWIR\n\nKetika seberkas foton mengenai matriks tanah, sebagian energi dihamburkan (*scattered*) oleh batas butir partikel dan sebagian lagi diserap (*absorbed*) pada panjang gelombang diskrit yang energinya tepat sama dengan selisih tingkat energi kuantum elektron atau ikatan molekul ($\\Delta E = h c / \\lambda$). Dalam rentang Vis–NIR–SWIR ($350\\text{–}2.500\\text{ nm}$), kurva spektral tanah ditentukan oleh dua proses mekanika kuantum yang bekerja pada wilayah panjang gelombang berbeda (Hunt, 1977; Clark, 1999; Stenberg et al., 2010):\n\n1. **Proses Elektronik pada Rentang Tampak hingga Inframerah Dekat ($350\\text{–}1.000\\text{ nm}$)**\n   Warna tanah dan cekungan serapan lebar di bawah $1.000\\text{ nm}$ dikendalikan oleh **oksida dan oksihidroksida besi bebas**, terutama **hematit ($\\alpha\\text{-Fe}_2\\text{O}_3$)** dan **goetit ($\\alpha\\text{-FeOOH}$)**, serta oleh kepadatan molekul **bahan organik tanah (SOM)**:\n   - **Transisi medan kristal (*crystal field transitions*) ion $\\text{Fe}^{3+}$**: Konfigurasi elektron kulit $3d^5$ pada ion besi ferri ($\\text{Fe}^{3+}$) di dalam koordinasi oktahedral mengalami pemisahan tingkat energi yang menyerap foton pada tiga pita diagnostik: (a) sekitar $430\\text{ nm}$ ($^6A_{1g} \\to \\,^4A_{1g},\\,^4E_g$), (b) bahu serapan pada $480\\text{ nm}$ (goetit) hingga $530\\text{ nm}$ (hematit) akibat transisi pasangan elektron (*electron pair transition* / EPT), dan (c) cekungan serapan lebar yang sangat diagnostik di daerah NIR, yaitu berpusat pada **$860\\text{–}890\\text{ nm}$ untuk hematit** dan bergeser ke arah panjang gelombang lebih panjang pada **$910\\text{–}940\\text{ nm}$ untuk goetit** (Sherman \u0026 Waite, 1985; Scheinost et al., 1998). Pergeseran posisi minimum antara $880\\text{ nm}$ dan $930\\text{ nm}$ ini digunakan secara luas oleh pedolog untuk menghitung rasio hematit/(hematit + goetit) sebagai indikator drainase tanah: tanah berdrainase baik dan mengalami musim kering tegas kaya akan hematit (berwarna merah *Munsell* 10R–2.5YR), sedangkan tanah di lereng bawah atau lembah yang lembap kaya akan goetit (berwarna kuning-cokelat 7.5YR–10YR).\n   - **Serapan bahan organik tanah (SOM / SOC)**: Senyawa humat (asam humat, asam fulvat, dan humin) memiliki jaringan ikatan rangkap terkonjugasi dan gugus kromofor aromatik yang menyerap cahaya tampak secara kuat mulai dari biru hingga merah. Kenaikan kadar karbon organik tanah (misalnya $\u003e2\\text{–}4\\%$) menurunkan reflektansi keseluruhan (*albedo*) dan mengubah bentuk lengkungan kurva pada rentang $400\\text{–}800\\text{ nm}$ dari bentuk cembung ke atas (*convex*, khas tanah mineral miskin SOM) menjadi lurus atau cekung ke bawah (*concave*, khas tanah gelap kaya humus) (Stoner \u0026 Baumgardner, 1981; Baumgardner et al., 1985).\n\n2. **Proses Vibrasi Molekul pada Rentang Inframerah Gelombang Pendek ($1.000\\text{–}2.500\\text{ nm}$)**\n   Ikatan kovalen di dalam molekul air, mineral lempung filosilkat, dan senyawa organik bergetar seperti pegas harmonik dan tak-harmonik (*anharmonic oscillator*). Sementara frekuensi fundamental vibrasi ulur (*stretching*, $\\nu$) dan tekuk (*bending*, $\\delta$) jatuh pada rentang MIR ($2.500\\text{–}25.000\\text{ nm}$), kelipatan energinya ($2\\nu, 3\\nu$) dan penjumlahannya ($\\nu + \\delta$) muncul sebagai pita serapan tajam di daerah SWIR (Viscarra Rossel et al., 2006; Ben-Dor et al., 2009):\n   - **Pita Air dan Hidroksil sekitar $1.400\\text{ nm}$ dan $1.900\\text{ nm}$**:\n     - Pita di sekitar **$1.414\\text{ nm}$** merupakan gabungan dari nada atas pertama ulur $\\text{O–H}$ air ($2\\nu_{\\text{OH}}$) dan nada atas ulur gugus hidroksil struktural $\\text{Al–OH}$ pada kisi oktahedral mineral lempung ($\\sim 1.395\\text{–}1.415\\text{ nm}$).\n     - Pita yang jauh lebih dalam dan asimetris di sekitar **$1.915\\text{ nm}$** merupakan kombinasi vibrasi ulur dan tekuk molekul air ($\\nu_{\\text{OH}} + \\delta_{\\text{H-O-H}}$). Karena mineral kaolinit (lempung 1:1 non-mengembang) tidak memiliki air antarlapis (*interlayer water*), sedangkan mineral **smektit / montmorilonit** (lempung 2:1 mengembang) menyimpan banyak molekul air terhidrasi di ruang antarlapisnya, kedalaman pita $1.915\\text{ nm}$ relatif terhadap pita $2.208\\text{ nm}$ menjadi penciri utama untuk membedakan tanah lempung beraktivitas tinggi (smektitik, KTK tinggi) dari tanah lempung beraktivitas rendah (kaolinitik, KTK rendah) (Chabrillat et al., 2002; Kariuki et al., 2004).\n   - **Pita Diagnostik Mineral Lempung pada Jendela $2.150\\text{–}2.400\\text{ nm}$**:\n     - **Kaolinit ($\\text{Al}_2\\text{Si}_2\\text{O}_5(\\text{OH})_4$)**: Menampilkan fitur **pita ganda (*doublet*)** yang sangat khas pada **$2.165\\text{ nm}$** (bahu kiri) dan **$2.208\\text{ nm}$** (puncak serapan utama) akibat kombinasi ulur dan tekuk ikatan $\\text{Al–OH}$ permukaan dalam dan luar lembar oktahedral.\n     - **Smektit (Montmorilonit)**: Menampilkan satu pita serapan tunggal yang simetris dan sedikit lebih lebar pada **$2.205\\text{ nm}$** tanpa bahu tajam di $2.165\\text{ nm}$ (atau bergeser ke $2.285\\text{ nm}$ pada nontronit kaya $\\text{Fe–OH}$ dan $2.310\\text{ nm}$ pada saponit kaya $\\text{Mg–OH}$).\n     - **Ilit / Muskovit (Mika)**: Memiliki serapan $\\text{Al–OH}$ pada **$2.200\\text{ nm}$** yang disertai dua pita sekunder jelas pada **$2.345\\text{ nm}$** dan **$2.440\\text{ nm}$**.\n     - **Gibsit ($\\text{Al(OH)}_3$)**: Hidroksida aluminium bebas penciri *Oxisols* terlapuk ekstrem menampilkan pita serapan khas pada **$2.265\\text{ nm}$**.\n     - **Karbonat ($\\text{CaCO}_3$ / Kalsit)**: Menampilkan pita kombinasi vibrasi ion $\\text{CO}_3^{2-}$ yang tajam pada **$2.335\\text{ nm}$**.\n   - **Pita Gugus Fungsional Bahan Organik (SOC) pada SWIR**:\n     Nada atas pertama dan pita kombinasi ikatan alifatik $\\text{C–H}$ (*methylene* $-\\text{CH}_2-$ dan *methyl* $-\\text{CH}_3$), gugus amida $\\text{N–H}$, serta gugus aromatik muncul pada panjang gelombang **$1.720\\text{–}1.760\\text{ nm}$**, **$2.050\\text{ nm}$**, dan **$2.305\\text{–}2.350\\text{ nm}$** (Ben-Dor et al., 1997; Viscarra Rossel \u0026 Behrens, 2010).\n\nGambar 7.3 memperlihatkan perbandingan kurva reflektansi Vis–NIR–SWIR dan hasil penajaman fitur serapan menggunakan metode *Continuum Removal* (CR) pada empat profil karakteristik tanah utama.\n\n![](assets/modul-7/M7-G03_fitur-serapan-spektral-vnir-swir-tanah.png)\nGambar 7.3 Karakteristik spektral tanah pada rentang Vis–NIR–SWIR ($400\\text{–}2.500\\text{ nm}$): (a) kurva reflektansi empat tipe kondisi tanah (kaya lempung kaolinitik, kaya oksida besi goetit, lempung sedang lembap khas Inceptisols Bompon, dan tanah kaya bahan organik); (b) kurva rasio Continuum Removal (CR) yang mengisolasi posisi dan kedalaman pita serapan spesifik $\\text{Fe}^{3+}$, $\\text{O–H}$, $\\text{Al–OH}$, dan $\\text{C–H}$.\nSumber: Disintesis dari pustaka spektral USGS/ICRAF-ISRIC (Clark, 1999; Viscarra Rossel et al., 2006) dan simulasi fisik Beer–Lambert.\n\nRingkasan pada Tabel 7.2 menyajikan daftar panjang gelombang diagnostik utama pada spektrum Vis–NIR–SWIR beserta penugasan ikatan kimianya sebagai panduan rujukan cepat bagi analis PSS.\n\nTabel 7.2 Pita serapan diagnostik utama pada spektrum reflektansi tanah Vis–NIR–SWIR ($400\\text{–}2.500\\text{ nm}$) dan kaitannya dengan sifat fisik-kimia tanah.\n\n| Panjang Gelombang ($\\text{nm}$) | Mekanisme Transisi / Ikatan Molekul | Komponen / Mineral Penciri | Sifat Tanah yang Berkorelasi Kuat |\n| :---: | :--- | :--- | :--- |\n| **$430, 480\\text{–}530$** | Transisi medan kristal \u0026 pasangan elektron $\\text{Fe}^{3+}$ | Goetit ($\\sim 480\\text{ nm}$) dan Hematit ($\\sim 530\\text{ nm}$) | Warna tanah (Munsell *hue/chroma*), besi bebas ($\\text{Fe}_d$), kelas drainase |\n| **$600\\text{–}750$** | Serapan elektronik senyawa aromatik \u0026 humat | Bahan organik tanah (asam humat / fulvat) | Karbon organik tanah (SOC), kecerahan tanah (*Munsell value*) |\n| **$860\\text{–}890$** | Transisi elektronik kristal $\\text{Fe}^{3+}$ ($^6A_{1g} \\to \\,^4T_{1g}$) | **Hematit** ($\\alpha\\text{-Fe}_2\\text{O}_3$) | Tingkat pelapukan lanjut pada lingkungan berdrainase baik (*Oxisols/Ultisols*) |\n| **$910\\text{–}940$** | Transisi elektronik kristal $\\text{Fe}^{3+}$ ($^6A_{1g} \\to \\,^4T_{1g}$) | **Goetit** ($\\alpha\\text{-FeOOH}$) | Tanah lingkungan lembap/basah (*Inceptisols* seperti di Sub-DAS Bompon) |\n| **$1.395\\text{–}1.415$** | Nada atas ke-1 ulur $\\text{O–H}$ ($2\\nu_{\\text{OH}}$) \u0026 struktural $\\text{Al–OH}$ | Air pori bebas + kisi oktahedral mineral lempung | Kadar air tanah dan total kandungan mineral lempung |\n| **$1.720\\text{–}1.760$** | Nada atas ke-1 ulur asimetris/simetris alifatik $\\text{C–H}$ | Gugus alkil $-\\text{CH}_2-$ dan $-\\text{CH}_3$ bahan organik | Fraksi bahan organik segar dan karbon organik total (SOC) |\n| **$1.910\\text{–}1.925$** | Kombinasi ulur + tekuk molekul air ($\\nu_{\\text{OH}} + \\delta_{\\text{H-O-H}}$) | Air higroskopis \u0026 air antarlapis **Smektit** (2:1) | Kadar air tanah, kapasitas tukar kation (KTK), plastisitas/potensi kembang-kerut |\n| **$2.165 \\text{ \u0026 } 2.208$** | Kombinasi ulur + tekuk $\\text{Al–OH}$ (*doublet* khas) | **Kaolinit** (mineral lempung 1:1) dan Haloisit | Fraksi **lempung (%)**, pelapukan silikat pada tanah tropis masam |\n| **$2.200\\text{–}2.205$** | Kombinasi ulur + tekuk $\\text{Al–OH}$ (puncak tunggal) | **Smektit / Montmorilonit** dan **Ilit** | Fraksi lempung (%), KTK, dan cadangan kalium mineral (pada ilit) |\n| **$2.265$** | Kombinasi ulur + tekuk $\\text{Al–OH}$ hidroksida bebas | **Gibsit** ($\\text{Al(OH)}_3$) | Pencucian silika lanjut (*desilication*) pada *Oxisols* tua |\n| **$2.305\\text{–}2.350$** | Kombinasi $\\text{C–H}$ organik, $\\text{Mg–OH}$ / $\\text{Fe–OH}$, atau $\\text{CO}_3^{2-}$ | Humus organik, Ilit ($2.345\\text{ nm}$), atau Kalsit ($2.335\\text{ nm}$) | Bahan organik tanah, mineral mika/klorit, atau kapur pertanian |\n\nSumber: Disintesis dari Hunt (1977), Clark (1999), Viscarra Rossel et al. (2006), Ben-Dor et al. (2009), dan Stenberg et al. (2010).\n\n---\n\n### Prapemrosesan Kemometrik dan Pemodelan Kalibrasi Spektral\n\nSpektrum reflektansi mentah ($R(\\lambda)$) yang keluar dari spektrometer tidak hanya memuat informasi serapan kimiawi kromofor tanah, melainkan juga terdistorsi oleh **hamburan fisik (*physical light scattering*)** akibat variasi ukuran agregat tanah, kekasaran permukaan sampel, dan fluktuasi jarak probe (Gambar 7.4a). Dalam kemometrik tanah (*soil chemometrics*), gangguan fisik tersebut wajib dibersihkan terlebih dahulu melalui rangkaian prapemrosesan matematis sebelum dimasukkan ke dalam model regresi multivariat (Rinnan et al., 2009; Viscarra Rossel et al., 2016):\n\n1. **Transformasi Absorbansi Semu (*Apparent Absorbance*)**:\n   Berdasarkan hukum Beer–Lambert, konsentrasi zat penyerap berbanding lurus dengan absorbansi, bukan reflektansi. Oleh karena itu, reflektansi $R(\\lambda) \\in (0, 1]$ diubah menjadi absorbansi semu $A(\\lambda)$:\n\n   $$A(\\lambda) = \\log_{10}\\left(\\frac{1}{R(\\lambda)}\\right) = -\\log_{10} R(\\lambda)$$\n\n2. **Koreksi Hamburan Multiplikatif: *Standard Normal Variate* (SNV)**\n   Diperkenalkan oleh Barnes et al. (1989), transformasi SNV menstandarisasi setiap kurva spektrum individu $i$ menggunakan rata-rata ($\\bar{A}_i$) dan simpangan baku ($s_{A_i}$) di sepanjang seluruh $P$ kanal panjang gelombang pada sampel tersebut:\n\n   $$A_{i, \\text{SNV}}(\\lambda_k) = \\frac{A_i(\\lambda_k) - \\bar{A}_i}{\\sqrt{\\frac{1}{P - 1}\\sum_{j=1}^{P}\\left(A_i(\\lambda_j) - \\bar{A}_i\\right)^2}}$$\n\n   Sebagaimana terlihat pada Gambar 7.4b, penerapan SNV menghilangkan pergeseran vertikal garis dasar (*baseline shift*) dan perbedaan kemiringan global akibat ukuran partikel, sehingga seluruh kurva spektrum berimpit rapi dan menonjolkan variasi relatif pada puncak serapan air dan lempung.\n3. **Penghalusan dan Turunan Spektral: Filter *Savitzky–Golay* (SG)**\n   Savitzky \u0026 Golay (1964) merumuskan metode konvolusi pencocokan polinomial lokal berderajat $d$ (umumnya $d = 2$ atau $3$) di dalam jendela geser selebar $2m + 1$ titik kanal untuk menghitung turunan spektral secara analitis sekaligus menekan derau frekuensi tinggi:\n   - **Turunan pertama ($dA / d\\lambda$)**: menghilangkan pergeseran *baseline* konstan secara sempurna; puncak maksimum absorbansi berubah menjadi titik potong nol (*zero-crossing*) dengan simpangan positif–negatif tajam di kedua sisinya (Gambar 7.4c).\n   - **Turunan kedua ($d^2A / d\\lambda^2$)**: menghilangkan pergeseran konstan maupun kemiringan linier *baseline*; puncak serapan muncul sebagai lembah minimum negatif yang tajam tepat pada panjang gelombang pusat pita serapan.\n4. **Penghilangan Kontinum (*Continuum Removal* / CR)**\n   Dirumuskan oleh Clark \u0026 Roush (1984), CR membagi nilai reflektansi spektrum asli $R(\\lambda)$ dengan garis selubung cembung atas (*upper convex hull* $C(\\lambda)$) yang menghubungkan titik-titik bahu lokal spektrum:\n\n   $$\\text{CR}(\\lambda) = \\frac{R(\\lambda)}{C(\\lambda)} \\in (0, 1] \\quad \\text{dan} \\quad D_b(\\lambda) = 1 - \\text{CR}(\\lambda)$$\n\n   di mana $D_b(\\lambda)$ adalah **kedalaman pita serapan (*band depth*)**. Metode CR sangat ideal untuk mengisolasi dan membandingkan luas maupun kedalaman fitur serapan mineral spesifik (seperti kedalaman pita $\\text{Al–OH}$ pada $2.208\\text{ nm}$ terhadap kadar lempung pada Gambar 7.3b).\n5. **Kalibrasi Multivariat dengan *Partial Least Squares Regression* (PLSR)**\n   Karena spektrum PSS memiliki ratusan hingga ribuan kanal yang saling berkorelasi sangat tinggi (*multicollinearity*), regresi kuadrat terkecil biasa (*Ordinary Least Squares*) akan mengalami kegagalan inversi matriks dan *overfitting* parah. Algoritma **Partial Least Squares Regression (PLSR)** (Wold et al., 2001) mengatasi masalah tersebut dengan memproyeksikan matriks spektrum $\\mathbf{X}$ ($N \\times P$) ke dalam sejumlah kecil **variabel laten ortogonal (*latent variables* / komponen PLS, $\\mathbf{T} = \\mathbf{X}\\mathbf{W}^*$)** yang secara simultan memaksimumkan kovariansi antara variasi spektral $\\mathbf{X}$ dan sifat tanah target $\\mathbf{y}$ (misalnya kadar lempung atau SOC).\n\nUntuk mendemonstrasikan dampak nyata prapemrosesan kemometrik terhadap akurasi prediksi tekstur tanah, Gambar 7.4 menyajikan hasil pemrosesan dan validasi silang 10-lipat (*10-fold cross-validation*) model PLSR (4 komponen laten) pada 50 sampel spektrum Vis–NIR–SWIR yang dikalibrasi mengikuti sebaran empiris kadar lempung Lapisan 1 Sub-DAS Bompon ($\\text{minimum } 35{,}69\\%$, $\\text{median } 51{,}65\\%$, $\\text{rerata } 51{,}82\\%$, $\\text{maksimum } 68{,}18\\%$, $\\text{SD } 7{,}40\\%$) sebagaimana dilaporkan oleh Fatmawati (2026).\n\n![](assets/modul-7/M7-G04_prapemrosesan-kemometrik-dan-kalibrasi-plsr.png)\nGambar 7.4 Alur prapemrosesan kemometrik dan kalibrasi spektral untuk pendugaan kadar lempung tanah ($N = 50$ sampel, $400\\text{–}2.500\\text{ nm}$): (a) spektrum reflektansi mentah ($R$) yang terdistorsi oleh variasi hamburan ukuran agregat; (b) spektrum absorbansi $\\log_{10}(1/R)$ setelah standarisasi SNV; (c) spektrum turunan pertama Savitzky–Golay ($d\\text{SNV}/d\\lambda$) pada jendela serapan lempung SWIR ($2.000\\text{–}2.420\\text{ nm}$) yang menonjolkan gradien serapan $\\text{Al–OH}$ di $2.208\\text{ nm}$; dan (d) diagram pencar validasi silang 10-lipat model PLSR.\nSumber: Analisis kemometrik dataset simulasi terkalibrasi Sub-DAS Bompon (`spektrum_pss_simulasi.csv`).\n\nPerbandingan metrik evaluasi pada Gambar 7.4d menunjukkan peningkatan akurasi yang sistematis di setiap tahap prapemrosesan:\n\n- Ketika model PLSR dilatih langsung pada **reflektansi mentah ($R$)** yang masih mengandung pergeseran *baseline* kekasaran agregat, validasi silang 10-lipat menghasilkan $R^2_{\\text{CV}} = 0{,}811$, $\\text{RMSE}_{\\text{CV}} = 3{,}18\\%$, $\\text{MAE}_{\\text{CV}} = 2{,}46\\%$, dan *Ratio of Performance to Deviation* ($\\text{RPD} = \\text{SD} / \\text{RMSE}$) sebesar $2{,}32$.\n- Setelah dikonversi menjadi **absorbansi $\\log_{10}(1/R)$ dan distandarisasi dengan SNV**, gangguan hamburan multiplikatif tereduksi sehingga akurasi meningkat menjadi $R^2_{\\text{CV}} = 0{,}881$, $\\text{RMSE}_{\\text{CV}} = 2{,}53\\%$, dan $\\text{RPD} = 2{,}92$.\n- Ketika dilanjutkan dengan **filter turunan pertama Savitzky–Golay** (jendela 9 kanal, polinomial orde 2), kemiringan *baseline* residual hilang sepenuhnya dan pemisahan gradien serapan $\\text{Al–OH}$ pada $2.165\\text{–}2.240\\text{ nm}$ (Gambar 7.4c) mendongkrak performa model menjadi **$R^2_{\\text{CV}} = 0{,}894$, $\\text{RMSE}_{\\text{CV}} = 2{,}39\\%$, $\\text{MAE}_{\\text{CV}} = 1{,}75\\%$, $\\text{RPD} = 3{,}10$, dan $\\text{RPIQ} = 3{,}72$** (kategori model kuantitatif sangat baik menurut kriteria Chang et al. (2001), yaitu $\\text{RPD} \u003e 2{,}0$ dan $R^2 \u003e 0{,}80$). Kontras yang sangat tajam antara tingginya akurasi prediksi lempung menggunakan spektrum PSS langsung pada sampel tanah ($R^2 \\approx 0{,}80\\text{–}0{,}90$) dan rendahnya kemampuan prediksi tekstur menggunakan citra satelit jarak jauh pada lanskap tertutup vegetasi rapat ($R^2 \\approx 0{,}10\\text{–}0{,}25$ sebagaimana akan kita bahas secara mendalam pada Modul 8) menegaskan betapa berharganya integrasi PSS ke dalam operasional survei tanah perkebunan.\n\n---\n\n*Demonstrasi dan praktik:*\n\n## Praktik: Prapemrosesan Kemometrik Spektrum Vis–NIR–SWIR dan Kalibrasi PLSR untuk Estimasi Tekstur Tanah\n\n### **Tujuan**\nPeserta mampu membaca matriks data spektral Vis–NIR–SWIR ($400\\text{–}2.500\\text{ nm}$), menerapkan empat teknik prapemrosesan kemometrik (transformasi absorbansi, SNV, turunan Savitzky–Golay, dan *Continuum Removal*), mengekstraksi kedalaman pita serapan spesifik mineral lempung pada $2.208\\text{ nm}$, serta melatih dan mengevaluasi model kalibrasi *Partial Least Squares Regression* (PLSR) dengan validasi silang 10-lipat menggunakan Python.\n\n### **Input Data**\n1. `Output/assets/modul-7/spektrum_pss_simulasi.csv` — Tabel matriks spektral 50 sampel tanah (kolom `id_sampel`, `pasir_persen`, `debu_persen`, `lempung_persen`, `soc_persen`, `lengas_persen`, diikuti oleh 211 kolom reflektansi `R_400nm` hingga `R_2500nm` dengan interval $10\\text{ nm}$).\n2. `Output/scripts/gambar_modul_7.py` — Skrip rujukan fungsi kemometrik dan PLSR.\n\n### **Software**\n- **Python 3.10+** dengan pustaka ilmiah standar (`numpy`, `scipy`, `matplotlib`, dan opsional `scikit-learn` / `pandas`) yang dijalankan melalui terminal, VS Code, atau **QGIS Python Console**.\n\n### **Langkah Kerja**\n\n1. **Inspeksi Struktur Tabel Spektral dan Sifat Tanah**\n   - Buka terminal pada direktori kerja proyek dan periksa 5 baris pertama serta dimensi berkas `Output/assets/modul-7/spektrum_pss_simulasi.csv` menggunakan perintah Python singkat:\n     ```bash\n     python3 -c \"\n     import csv, numpy as np\n     with open('Output/assets/modul-7/spektrum_pss_simulasi.csv') as f:\n         r = list(csv.reader(f))\n     print('Jumlah baris sampel:', len(r)-1, '| Jumlah kolom:', len(r[0]))\n     print('Kolom atribut:', r[0][:8], '...', r[0][-3:])\n     \"\n     ```\n   - Pastikan terdapat 50 baris sampel (`S01` hingga `S50`), 6 kolom sifat fisik-kimia tanah, dan 211 kolom kanal spektral (`R_400nm` s.d. `R_2500nm`).\n\n2. **Penerapan Transformasi Absorbansi, SNV, dan Turunan Savitzky–Golay**\n   - Buat skrip latihan atau jalankan kode berikut untuk membaca matriks reflektansi $\\mathbf{R}$, menghitung absorbansi $\\mathbf{A} = \\log_{10}(1/\\mathbf{R})$, melakukan koreksi hamburan **SNV**, dan menghitung turunan pertama **Savitzky–Golay**:\n     ```python\n     import csv\n     import numpy as np\n     from scipy.signal import savgol_filter\n\n     with open(\"Output/assets/modul-7/spektrum_pss_simulasi.csv\", encoding=\"utf-8\") as fh:\n         baris = list(csv.reader(fh))\n     header = baris[0]\n     data = np.array([[float(x) for x in b[1:]] for b in baris[1:]])\n\n     lempung = data[:, 2]          # kolom ke-3: lempung_persen\n     soc = data[:, 3]              # kolom ke-4: soc_persen\n     wl = np.arange(400.0, 2501.0, 10.0)\n     R = data[:, 5:]               # 211 kanal reflektansi (400-2500 nm)\n\n     # 1. Absorbansi semu Beer-Lambert\n     A = np.log10(1.0 / R)\n     # 2. Standard Normal Variate (SNV) per sampel (baris)\n     A_snv = (A - A.mean(axis=1, keepdims=True)) / A.std(axis=1, keepdims=True)\n     # 3. Turunan pertama Savitzky-Golay (jendela 9 titik = 80 nm, polinomial orde 2)\n     A_sg1 = savgol_filter(A_snv, window_length=9, polyorder=2, deriv=1, delta=10.0, axis=1)\n     ```\n\n3. **Ekstraksi Kedalaman Pita Serapan (*Band Depth*) Kaolinit pada 2.208 nm dengan Continuum Removal**\n   - Untuk menguji hubungan langsung antara fitur serapan ikatan $\\text{Al–OH}$ pada $\\sim 2.210\\text{ nm}$ dan kadar lempung tanpa model multivariat, hitung kedalaman pita lokal di antara bahu $2.120\\text{ nm}$ dan $2.260\\text{ nm}$:\n     ```python\n     idx_2120 = int(np.where(wl == 2120)[0][0])\n     idx_2210 = int(np.where(wl == 2210)[0][0])\n     idx_2260 = int(np.where(wl == 2260)[0][0])\n\n     # Interpolasi garis kontinum lokal pada 2210 nm dari bahu 2120 nm dan 2260 nm\n     fraksi = (2210.0 - 2120.0) / (2260.0 - 2120.0)\n     R_kontinum_2210 = R[:, idx_2120] + fraksi * (R[:, idx_2260] - R[:, idx_2120])\n     CR_2210 = R[:, idx_2210] / R_kontinum_2210\n     depth_2210 = 1.0 - CR_2210\n\n     r_corr = np.corrcoef(depth_2210, lempung)[0, 1]\n     print(f\"Korelasi Pearson kedalaman pita 2.210 nm vs Kadar Lempung: r = {r_corr:.3f}\")\n     ```\n\n4. **Pelatihan dan Validasi Silang 10-Lipat Model PLSR**\n   - Jalankan skrip `python3 Output/scripts/gambar_modul_7.py` untuk mengeksekusi algoritma PLSR 10-lipat secara penuh pada ketiga matriks fitur (`R`, `A_snv`, dan `A_sg1`) serta menghasilkan grafik diagnostik `M7-G04_prapemrosesan-kemometrik-dan-kalibrasi-plsr.png` dan ringkasan metrik `Output/assets/modul-7/statistik_modul_7.json`.\n   - Bandingkan perubahan nilai $R^2_{\\text{CV}}$, $\\text{RMSE}_{\\text{CV}}$, $\\text{MAE}_{\\text{CV}}$, $\\text{RPD}$, dan $\\text{RPIQ}$ sebelum dan sesudah penerapan SNV serta turunan Savitzky–Golay.\n\n5. **Eksperimen Pemilihan Jumlah Komponen Laten (*Latent Variables*)**\n   - Ubah parameter `n_comp` pada pemanggilan fungsi `plsr_sederhana(X_mat[idx_tr], lempung[idx_tr], n_comp=k)` untuk $k \\in \\{1, 2, 3, 4, 6, 10, 15\\}$ dan amati bagaimana nilai $\\text{RMSE}_{\\text{CV}}$ menurun tajam dari $k=1$ hingga mencapai minimum optimal pada $k=4$, lalu mulai meningkat kembali (*overfitting*) ketika $k \u003e 10$.\n\n### **Expected Output**\n1. Berkas tabel spektral `Output/assets/modul-7/spektrum_pss_simulasi.csv` dan berkas hasil evaluasi metrik kemometrik `Output/assets/modul-7/statistik_modul_7.json`.\n2. Nilai koefisien korelasi positif kuat ($r \u003e 0{,}85$) antara kedalaman pita serapan *Continuum Removal* pada $2.210\\text{ nm}$ dan kadar lempung laboratorium.\n3. Empat panel grafik diagnostik kemometrik dan validasi silang PLSR (`M7-G04_prapemrosesan-kemometrik-dan-kalibrasi-plsr.png`) yang membuktikan peningkatan $\\text{RPD}$ dari $2{,}32$ (spektrum mentah) menjadi $3{,}10$ (SNV + turunan pertama Savitzky–Golay).\n\n### **Interpretation**\n- Hasil praktik menunjukkan bahwa meskipun kurva reflektansi mentah ($R$) tampak saling bertumpuk secara acak akibat perbedaan ukuran agregat dan kekasaran permukaan sampel (Gambar 7.4a), informasi kuantitatif mengenai konsentrasi mineral lempung sesungguhnya tetap tersimpan secara utuh di dalam kemiringan pita serapan $\\text{Al–OH}$ pada panjang gelombang $2.165\\text{–}2.210\\text{ nm}$.\n- Transformasi SNV dan turunan pertama Savitzky–Golay bekerja secara komplementer: SNV menyamakan skala amplitudo antar-sampel, sedangkan turunan pertama memisahkan sinyal serapan sempit mineral lempung dari latar belakang serapan lebar air dan oksida besi.\n- Dengan nilai $\\text{RPD} = 3{,}10$ dan $\\text{RMSE}_{\\text{CV}} = 2{,}39\\%$, model kalibrasi PSS ini memiliki ketelitian yang memadai untuk menggantikan analisis tekstur laboratorium rutin pada ratusan sampel tambahan dari kawasan studi yang memiliki litologi serupa.\n\n### **Troubleshooting**\n1. **Nilai $\\text{RMSE}_{\\text{CV}}$ justru memburuk drastis ketika menggunakan turunan kedua Savitzky–Golay dengan `window_length=3` atau `5`**:\n   - *Penyebab*: Diferensiasi numerik orde tinggi pada jendela yang terlalu sempit mengamplifikasi derau instrumen frekuensi tinggi (*high-frequency random noise*) berkali-kali lipat sehingga menenggelamkan sinyal serapan kimia.\n   - *Solusi*: Perlebar ukuran jendela penghalusan menjadi `window_length=9` hingga `15` (setara lebar $80\\text{–}140\\text{ nm}$ pada interval $10\\text{ nm}$, atau $21\\text{–}31$ kanal pada interval $1\\text{ nm}$) sebelum menghitung turunan kedua.\n2. **Fungsi `np.linalg.inv` gagal atau menghasilkan matriks singular saat melatih regresi pada spektrum**:\n   - *Penyebab*: Pengguna mencoba menerapkan regresi linier berganda biasa (*Ordinary Least Squares* / OLS) langsung pada 211 kanal spektral untuk 50 sampel ($P \u003e N$ dan kolinearitas ekstrem).\n   - *Solusi*: Jangan pernah menggunakan OLS pada spektrum penuh; selalu gunakan metode reduksi dimensi terawasi seperti **PLSR** (`n_comp=3` s.d. `8`), *Principal Component Regression* (PCR), atau regresi terregularisasi (*Ridge / ElasticNet*).\n3. **Model kalibrasi PLSR dari tanah kering udara gagal memprediksi sampel tanah basah yang baru diambil dari lapangan**:\n   - *Penyebab*: Air bebas di dalam pori tanah segar memperlebar dan memperdalam pita $1.414\\text{ nm}$ dan $1.915\\text{ nm}$ secara nonlinier serta menutupi bahu serapan lempung di $2.165\\text{–}2.208\\text{ nm}$ (Minasny et al., 2011).\n   - *Solusi*: Keringudarakan dan ayak sampel tanah terlebih dahulu untuk pemindaian standar laboratorium, atau terapkan algoritma **External Parameter Orthogonalization (EPO)** / *Direct Standardization* (DS) untuk memproyeksikan spektrum tanah lapangan ke sub-ruang yang ortogonal terhadap variasi kelembapan tanah (Roger et al., 2003; Minasny et al., 2011).\n\n---\n\n## Rangkuman\n\n1. *Proximal Soil Sensing* (PSS) adalah teknologi penginderaan tanah menggunakan sensor yang berkontak langsung atau berjarak kurang dari 2 meter dari matriks tanah, mencakup empat kelompok instrumen utama: spektroskopi optik/inframerah (Vis–NIR–SWIR dan MIR), spektroskopi atomik (pXRF dan LIBS), geofisika elektromagnetik/radar (EMI, ERT, dan GPR), serta radiometri sinar gama dan sensor elektrokimia/mekanis.\n2. Dibandingkan *Remote Sensing* (RS) satelit yang menyediakan cakupan spasial menerus (*wall-to-wall*) tetapi terbatas pada kulit permukaan ($0\\text{–}2\\text{ mm}$), resolusi kanal lebar, dan terhalang oleh atmosfer maupun tajuk vegetasi, PSS menawarkan resolusi spektral ultra-halus ($1\\text{–}2\\text{ nm}$), bebas gangguan atmosfer/tajuk, serta mampu mengkarakterisasi sifat tanah pada berbagai kedalaman horizon profil ($0\\text{–}100\\text{ cm}$).\n3. Spektrum pantulan tanah Vis–NIR–SWIR ($350\\text{–}2.500\\text{ nm}$) dikendalikan oleh transisi elektronik ion $\\text{Fe}^{3+}$ pada hematit ($\\sim 885\\text{ nm}$) dan goetit ($\\sim 925\\text{ nm}$) serta serapan senyawa humat di daerah tampak–NIR, yang berpadu dengan nada atas dan pita kombinasi vibrasi molekul air ($\\sim 1.414\\text{ nm}$ dan $1.915\\text{ nm}$), gugus $\\text{Al–OH}$ mineral lempung kaolinit (*doublet* $2.165\\text{ nm}$ dan $2.208\\text{ nm}$) dan smektit ($2.205\\text{ nm}$), serta ikatan $\\text{C–H}$ bahan organik ($1.726\\text{ nm}$ dan $2.312\\text{ nm}$) di daerah SWIR.\n4. Prapemrosesan kemometrik—meliputi konversi absorbansi $\\log_{10}(1/R)$, koreksi hamburan *Standard Normal Variate* (SNV), turunan *Savitzky–Golay*, dan *Continuum Removal* (CR)—merupakan tahapan esensial untuk menghilangkan efek hamburan fisik ukuran agregat sebelum pemodelan multivariat dengan *Partial Least Squares Regression* (PLSR).\n5. Evaluasi pada dataset spektral terkalibrasi Sub-DAS Bompon membuktikan bahwa kombinasi SNV dan turunan pertama Savitzky–Golay meningkatkan akurasi prediksi kadar lempung PLSR dari $R^2_{\\text{CV}} = 0{,}811$ ($\\text{RMSE} = 3{,}18\\%$, $\\text{RPD} = 2{,}32$) pada reflektansi mentah menjadi $R^2_{\\text{CV}} = 0{,}894$ ($\\text{RMSE} = 2{,}39\\%$, $\\text{RPD} = 3{,}10$), sekaligus menunjukkan bagaimana PSS dapat mempercepat penyediaan data sifat tanah untuk pemetaan tanah digital di perkebunan kelapa sawit.\n\n---\n\n## Daftar Pustaka\n\nAckerson, J. P., Morgan, C. L. S., \u0026 Ge, Y. (2017). Penetrometer-mounted VisNIR spectroscopy: Application of EPO-PLS to in situ VisNIR spectra. *Geoderma*, 286, 131–138. https://doi.org/10.1016/j.geoderma.2016.10.018\n\nAdamchuk, V. I., Hummel, J. W., Morgan, M. T., \u0026 Upadhyaya, S. K. (2004). On-the-go soil sensors for precision agriculture. *Computers and Electronics in Agriculture*, 44(1), 71–91. https://doi.org/10.1016/j.compag.2004.03.002\n\nBarnes, R. J., Dhanoa, M. S., \u0026 Lister, S. J. (1989). Standard normal variate transformation and de-trending of near-infrared diffuse reflectance spectra. *Applied Spectroscopy*, 43(5), 772–777. https://doi.org/10.1366/0003702894202201\n\nBaumgardner, M. F., Silva, L. F., Biehl, L. L., \u0026 Stoner, E. R. (1985). Reflectance properties of soils. *Advances in Agronomy*, 38, 1–44. https://doi.org/10.1016/S0065-2113(08)60672-0\n\nBen-Dor, E., Chabrillat, S., Demattê, J. A. M., Taylor, G. R., Hill, J., Whiting, M. L., \u0026 Sommer, S. (2009). Using imaging spectroscopy to study soil properties. *Remote Sensing of Environment*, 113(Suppl. 1), S38–S55. https://doi.org/10.1016/j.rse.2008.09.019\n\nBen-Dor, E., Inbar, Y., \u0026 Chen, Y. (1997). The reflectance spectra of organic matter in the visible near-infrared and short wave infrared region (400–2500 nm) during a controlled decomposition process. *Remote Sensing of Environment*, 61(1), 1–15. https://doi.org/10.1016/S0034-4257(96)00120-4\n\nChabrillat, S., Ben-Dor, E., Cierniewski, J., Gomez, C., Schmid, T., \u0026 van Wesemael, B. (2019). Imaging spectroscopy for soil mapping and monitoring. *Surveys in Geophysics*, 40(3), 361–399. https://doi.org/10.1007/s10712-019-09524-0\n\nChabrillat, S., Goetz, A. F. H., Krosley, L., \u0026 Olsen, H. W. (2002). Use of hyperspectral images in the identification and mapping of expansive clay soils and the role of spatial resolution. *Remote Sensing of En
